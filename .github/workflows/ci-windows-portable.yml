permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # LAWOSS testy appky importujú aj zdrojáky servera (napr. zod), preto celý
      # workspace bez install skriptov; balenie ani podpisovanie tu nebeží.
      - name: Install source test and typecheck dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Diagnostic branch only: preserve the original security-process warmup
      # without instrumenting an earlier helper test in the same Bun process.
      - name: Watched skill promotion regression against original implementation
        if: ${{ !cancelled() }}
        working-directory: apps/server
        run: bun test src/reload-watcher.test.ts --test-name-pattern 'promot'

      - name: Security boundaries and Windows archive destinations
        # Beží aj po páde predchádzajúceho kroku, aby sa bezpečnostné regresie na Windows vždy overili.
        if: ${{ !cancelled() }}
        working-directory: apps/server
        run: bun test src/frontmatter.test.ts src/frontmatter-security.e2e.test.ts src/security-auth-boundaries.e2e.test.ts src/security-file-boundary.e2e.test.ts src/word-addin.e2e.test.ts src/word-addin-shell.test.ts src/benchmarks/document-path.test.ts src/benchmarks/task-zip.test.ts src/benchmarks/harvey-catalog.test.ts src/benchmarks/store.test.ts

      - name: Validate read-only Restart Manager on an owned lock
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref_name == 'chore/pr165-windows-lock-probe' }}
        timeout-minutes: 1
        shell: pwsh
        run: ./lawoss/testing/isir/windows-skill-lock-smoke.ps1

      - name: Owned descendant watch rename discrimination
        if: ${{ !cancelled() }}
        run: bun lawoss/testing/isir/windows-directory-rename-probe.mjs

      - name: Diagnostic helper unit tests in a separate process
        if: ${{ !cancelled() }}
        working-directory: apps/server
        run: bun test src/lawoss/test-support/windows-skill-locks.test.ts

      - name: Messaging control and local media isolation
        # Beží aj po páde predchádzajúceho kroku, aby sa bezpečnostné regresie na Windows vždy overili.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          pnpm --filter opencode-router test:unit
          node --test apps/orchestrator/scripts/router-control-security.test.mjs

  # Manual supplementary probe: reuse a verified ancestor's runtime artifact
  # while retaining every regular PR/source/package check unchanged.
  native-windows-diagnostics:
    if: github.event_name == 'workflow_dispatch' && github.ref_name != 'chore/pr165-windows-lock-probe'
    name: Diagnostic native Windows (full synthetic flow)
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MACOS_NOTARIZE: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enable Windows long paths
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Verify runtime artifact provenance
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const id=process.env.RUNTIME_RUN_ID;
          assert.match(id,/^[1-9][0-9]*$/);
          const repo=process.env.GITHUB_REPOSITORY;
          const response=await fetch(`https://api.github.com/repos/${repo}/actions/runs/${id}`,{headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28'}});
          assert.equal(response.status,200);
          const run=await response.json();
          assert.equal(run.path,'.github/workflows/ci-desktop-packaging.yml');
          assert.equal(run.head_repository.full_name.toLowerCase(),repo.toLowerCase());
          assert.equal(run.head_branch,process.env.GITHUB_REF_NAME);
          assert.match(run.head_sha,/^[a-f0-9]{40}$/);
          execFileSync('git',['merge-base','--is-ancestor',run.head_sha,'HEAD'],{stdio:'pipe'});
          console.log('PASS trusted desktop runtime from an ancestor of this branch');
          NODE
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-runtime-win32-x64
          path: ${{ runner.temp }}/sandbox-runtime
          run-id: ${{ inputs.runtime_run_id }}
          github-token: ${{ github.token }}
      - name: Unpack protected runtime
        run: |
          mkdir -p apps/server/resources/agent-sandbox/runtime
          archive="$(cygpath -u "$RUNNER_TEMP/sandbox-runtime/sandbox-runtime.tgz")"
          tar -xzf "$archive" -C apps/server/resources/agent-sandbox/runtime
      - name: Build desktop app and native dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @legalwork/desktop build:electron
      - name: Full synthetic native flow with bounded bootstrap tracing
        timeout-minutes: 12
        env:
          LAWOSS_ISIR_NATIVE_DIAGNOSTICS: "1"
          LAWOSS_ISIR_NATIVE_DIAGNOSTICS_FILE: ${{ runner.temp }}/isir-native-diagnostics.json
        run: pnpm test:isir:native
      - name: Upload synthetic native boundary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isir-native-diagnostics-windows-manual
          path: ${{ runner.temp }}/isir-native-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
