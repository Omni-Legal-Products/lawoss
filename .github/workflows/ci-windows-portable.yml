permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # LAWOSS testy appky importujú aj zdrojáky servera (napr. zod), preto celý
      # workspace bez install skriptov; balenie ani podpisovanie tu nebeží.
      - name: Install source test and typecheck dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: OKF typecheck
        run: pnpm --filter @lawoss/okf typecheck
      - name: OKF and naming
        run: bun test lawoss/okf/test/
      - name: Memory typecheck
        run: pnpm --filter @lawoss/okf-pamat typecheck
      - name: Memory tests
        run: pnpm --filter @lawoss/okf-pamat test
      - name: Native handoff source tests
        run: bun test lawoss/okf-handoff/
      # Strom procesov: taskkill /T musí zhodiť aj vnúča nástroja agenta (python,
      # soffice, node), inak drží zámky v priečinku klienta. Bundle OKF bežia
      # s Node runnera v ceste s medzerou a diakritikou, len s ním v PATH.
      - name: Updater, persistent native registration, picked folders, process tree and OKF CLI
        run: node --test apps/desktop/electron/update-feed.test.mjs apps/desktop/electron/updater.test.mjs apps/desktop/electron/workspace-store.test.mjs apps/desktop/electron/lawoss-picked-path.test.mjs apps/desktop/electron/lawoss-process-tree.test.mjs apps/desktop/electron/lawoss-okf-cli-smoke.test.mjs
      # Pohľady z OKF (Dnes, Klienti, detail veci), onboarding a Lite dostávajú na
      # Windows cesty v tvare C:\...; bez tohto kroku tu nebežal žiadny ich test.
      # Filtre bez lomky, aby sedeli aj na cestách so spätnou lomkou.
      - name: LAWOSS app logic (OKF views, onboarding, Lite)
        working-directory: apps/app
        run: bun test lawoss- okf- document-processing native-document-generation project-folder-recovery workspace-attachment home-submission fusion-routing session-sync-permissions session-sync-tool-parts message-queue-runner session-sync-retention
      # Server s onboardingom, registráciou existujúceho priečinka, roztriedením,
      # pamäťou a kanonickými cestami beží na Windows prvýkrát; dist sa tu nestavia,
      # takže filter zachytí len zdrojové testy (bez lomky kvôli cestám s `\`).
      # lawoss-path-containment: workspace v koreni disku (subst) a zdieľania (net share).
      - name: LAWOSS server (onboarding, register existing, triage, memory, paths, containment, reload watcher, process tree)
        working-directory: apps/server
        run: bun test lawoss reload-watcher workspace-reconnect artifact-files isir-case-attachments

      - name: ISIR attachments in ten case folders (synthetic offline corpus)
        run: pnpm test:isir

      - name: Security boundaries and Windows archive destinations
        # Beží aj po páde predchádzajúceho kroku, aby sa bezpečnostné regresie na Windows vždy overili.
        if: ${{ !cancelled() }}
        working-directory: apps/server
        run: bun test src/frontmatter.test.ts src/frontmatter-security.e2e.test.ts src/security-auth-boundaries.e2e.test.ts src/security-file-boundary.e2e.test.ts src/word-addin.e2e.test.ts src/word-addin-shell.test.ts src/benchmarks/document-path.test.ts src/benchmarks/task-zip.test.ts src/benchmarks/harvey-catalog.test.ts src/benchmarks/store.test.ts

      - name: Messaging control and local media isolation
        # Beží aj po páde predchádzajúceho kroku, aby sa bezpečnostné regresie na Windows vždy overili.
        if: ${{ !cancelled() }}
        run: |
          pnpm --filter opencode-router test:unit
          node --test apps/orchestrator/scripts/router-control-security.test.mjs
