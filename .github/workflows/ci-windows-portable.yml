name: LAWOSS Windows source tests

on:
  pull_request:
    # Include stacked feature PRs; no release or signing workflow is involved.
    paths:
      - lawoss/okf/**
      - lawoss/okf-pamat/**
      - lawoss/okf-handoff/**
      - lawoss/tests/**
      - apps/app/src/lawoss/**
      - apps/app/tests/lawoss-*
      - apps/app/tests/okf-*
      - apps/app/package.json
      - apps/desktop/electron/update-feed.mjs
      - apps/desktop/electron/update-feed.test.mjs
      - apps/desktop/electron/updater.mjs
      - apps/desktop/electron/updater.test.mjs
      - apps/desktop/electron/workspace-store.mjs
      - apps/desktop/electron/workspace-store.test.mjs
      - apps/desktop/electron/lawoss-picked-path.mjs
      - apps/desktop/electron/lawoss-picked-path.test.mjs
      - apps/desktop/electron/main.mjs
      - apps/app/src/react-app/shell/welcome-route.tsx
      - apps/server/src/lawoss/**
      - apps/server/src/lawoss-*
      - apps/server/src/reload-watcher.ts
      - apps/server/src/reload-watcher.test.ts
      - apps/server/src/routes/workspaces.ts
      - apps/server/src/routes/files.ts
      - apps/server/src/paths.ts
      - apps/server/src/server.ts
      - apps/server/src/embedded.ts
      - apps/server/src/cloud-plugins.ts
      - apps/server/src/opencode-plugins/office-plugin-shared.ts
      - apps/desktop/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/ci-windows-portable.yml
  push:
    branches: [dev]
    paths:
      - lawoss/okf/**
      - lawoss/okf-pamat/**
      - lawoss/okf-handoff/**
      - lawoss/tests/**
      - apps/app/src/lawoss/**
      - apps/app/tests/lawoss-*
      - apps/app/tests/okf-*
      - apps/app/package.json
      - apps/desktop/electron/update-feed.mjs
      - apps/desktop/electron/update-feed.test.mjs
      - apps/desktop/electron/updater.mjs
      - apps/desktop/electron/updater.test.mjs
      - apps/desktop/electron/workspace-store.mjs
      - apps/desktop/electron/workspace-store.test.mjs
      - apps/desktop/electron/lawoss-picked-path.mjs
      - apps/desktop/electron/lawoss-picked-path.test.mjs
      - apps/desktop/electron/main.mjs
      - apps/app/src/react-app/shell/welcome-route.tsx
      - apps/server/src/lawoss/**
      - apps/server/src/lawoss-*
      - apps/server/src/reload-watcher.ts
      - apps/server/src/reload-watcher.test.ts
      - apps/server/src/routes/workspaces.ts
      - apps/server/src/routes/files.ts
      - apps/server/src/paths.ts
      - apps/server/src/server.ts
      - apps/server/src/embedded.ts
      - apps/server/src/cloud-plugins.ts
      - apps/server/src/opencode-plugins/office-plugin-shared.ts
      - apps/desktop/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/ci-windows-portable.yml

permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # LAWOSS testy appky importujú aj zdrojáky servera (napr. zod), preto celý
      # workspace bez install skriptov; balenie ani podpisovanie tu nebeží.
      - name: Install source test and typecheck dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: OKF typecheck
        run: pnpm --filter @lawoss/okf typecheck
      - name: OKF and naming
        run: bun test lawoss/okf/test/
      - name: Memory typecheck
        run: pnpm --filter @lawoss/okf-pamat typecheck
      - name: Memory tests
        run: pnpm --filter @lawoss/okf-pamat test
      - name: Native handoff source tests
        run: bun test lawoss/okf-handoff/
      - name: Updater, persistent native registration and picked folders
        run: node --test apps/desktop/electron/update-feed.test.mjs apps/desktop/electron/updater.test.mjs apps/desktop/electron/workspace-store.test.mjs apps/desktop/electron/lawoss-picked-path.test.mjs
      # Pohľady z OKF (Dnes, Klienti, detail veci), onboarding a Lite dostávajú na
      # Windows cesty v tvare C:\...; bez tohto kroku tu nebežal žiadny ich test.
      # Filtre bez lomky, aby sedeli aj na cestách so spätnou lomkou.
      - name: LAWOSS app logic (OKF views, onboarding, Lite)
        working-directory: apps/app
        run: bun test lawoss- okf-
      # Server s onboardingom, registráciou existujúceho priečinka, roztriedením,
      # pamäťou a kanonickými cestami beží na Windows prvýkrát; dist sa tu nestavia,
      # takže filter zachytí len zdrojové testy (bez lomky kvôli cestám s `\`).
      # lawoss-path-containment: workspace v koreni disku (subst) a zdieľania (net share).
      - name: LAWOSS server (onboarding, register existing, triage, memory, paths, containment, reload watcher)
        working-directory: apps/server
        run: bun test lawoss reload-watcher
