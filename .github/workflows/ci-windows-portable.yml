permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # LAWOSS testy appky importujú aj zdrojáky servera (napr. zod), preto celý
      # workspace bez install skriptov; balenie ani podpisovanie tu nebeží.
      - name: Install source test and typecheck dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: OKF typecheck
        run: pnpm --filter @lawoss/okf typecheck
      - name: OKF and naming
        run: bun test lawoss/okf/test/
      - name: Memory typecheck
        run: pnpm --filter @lawoss/okf-pamat typecheck
      - name: Memory tests
        run: pnpm --filter @lawoss/okf-pamat test
      - name: Native handoff source tests
        run: bun test lawoss/okf-handoff/
      # Strom procesov: taskkill /T musí zhodiť aj vnúča nástroja agenta (python,
      # soffice, node), inak drží zámky v priečinku klienta. Bundle OKF bežia
      # s Node runnera v ceste s medzerou a diakritikou, len s ním v PATH.
      - name: Updater, persistent native registration, picked folders, process tree and OKF CLI
        run: node --test apps/desktop/electron/update-feed.test.mjs apps/desktop/electron/updater.test.mjs apps/desktop/electron/workspace-store.test.mjs apps/desktop/electron/lawoss-picked-path.test.mjs apps/desktop/electron/lawoss-process-tree.test.mjs apps/desktop/electron/lawoss-okf-cli-smoke.test.mjs
      # Pohľady z OKF (Dnes, Klienti, detail veci), onboarding a Lite dostávajú na
      # Windows cesty v tvare C:\...; bez tohto kroku tu nebežal žiadny ich test.
      # Filtre bez lomky, aby sedeli aj na cestách so spätnou lomkou.
      - name: LAWOSS app logic (OKF views, onboarding, Lite)
        working-directory: apps/app
        run: bun test lawoss- okf- document-processing native-document-generation project-folder-recovery workspace-attachment home-submission fusion-routing session-sync-permissions session-sync-tool-parts message-queue-runner session-sync-retention session-render-boundary
      # Server s onboardingom, registráciou existujúceho priečinka, roztriedením,
      # pamäťou a kanonickými cestami. Explicitné ./src cesty fungujú aj
      # na Windows a nevložia Node helpery do Bun; dist zostavujeme až potom.
      # lawoss-path-containment: workspace v koreni disku (subst) a zdieľania (net share).
      - name: LAWOSS server (onboarding, register existing, triage, memory, paths, containment, reload watcher, process tree)
        id: windows_server_source
        working-directory: apps/server
        env:
          LAWOSS_PROJECT_SYNC_TEST_DIAGNOSTICS: '1'
        run: >-
          bun test
          ./src/artifact-files.e2e.test.ts
          ./src/cloud-plugin-resources.test.ts
          ./src/cloud-plugins.test.ts
          ./src/eigenwelt-connection-store.test.ts
          ./src/eigenwelt-hub-installs-store.test.ts
          ./src/eigenwelt-refresh.test.ts
          ./src/eigenwelt-sync-events.test.ts
          ./src/isir-case-attachments.e2e.test.ts
          ./src/lawoss-anthropic-runtime.test.ts
          ./src/lawoss-documents-export.test.ts
          ./src/lawoss-documents.e2e.test.ts
          ./src/lawoss-global-providers.e2e.test.ts
          ./src/lawoss-okf-config-encoding.e2e.test.ts
          ./src/lawoss-onboarding.e2e.test.ts
          ./src/lawoss-path-containment.e2e.test.ts
          ./src/lawoss-register-existing.e2e.test.ts
          ./src/lawoss-triage.e2e.test.ts
          ./src/lawoss-workspace-memory-context.e2e.test.ts
          ./src/lawoss-workspace-memory.e2e.test.ts
          ./src/lawoss/canonical-path.test.ts
          ./src/lawoss/chatgpt-subscription.test.ts
          ./src/lawoss/commercial-services.test.ts
          ./src/lawoss/eigenwelt-account.test.ts
          ./src/lawoss/engine-network.test.ts
          ./src/lawoss/marketplace-global.test.ts
          ./src/lawoss/marketplace-updates.test.ts
          ./src/lawoss/ocr-on-demand.test.ts
          ./src/lawoss/ocr-opt-in.test.ts
          ./src/lawoss/path-within.test.ts
          ./src/lawoss/plugin-provenance.test.ts
          ./src/lawoss/process-tree.test.ts
          ./src/lawoss/test-support/inspect-cleanup.test.ts
          ./src/lawoss/test-support/owned-child-process.test.ts
          ./src/legalwork-runtime-config.test.ts
          ./src/mcp-shared-store.test.ts
          ./src/opencode-proxy-cancellation.e2e.test.ts
          ./src/project-contents.test.ts
          ./src/project-sync.test.ts
          ./src/reload-watcher.test.ts
          ./src/runtime-config-migrate.e2e.test.ts
          ./src/runtime-db-lifecycle.e2e.test.ts
          ./src/runtime-db-lifecycle.test.ts
          ./src/runtime-opencode-config-store.provider-patch.test.ts
          ./src/runtime-opencode-config-store.test.ts
          ./src/serve-node.test.ts
          ./src/session-groups.e2e.test.ts
          ./src/task-notifications.test.ts
          ./src/task-store.test.ts
          ./src/task-sync.test.ts
          ./src/workspace-reconnect.e2e.test.ts
          ./src/test-support/project-sync-first-failure-timing.test.ts

      - name: Diagnose pending task handoff in a fresh Bun process
        if: ${{ failure() && steps.windows_server_source.outcome == 'failure' }}
        working-directory: apps/server
        run: >-
          bun test ./src/runtime-db-lifecycle.e2e.test.ts
          --test-name-pattern '^an accepted pending tasks round survives its originating owner stopping$'

      # Node 24 používa node:sqlite bez postinstall/native addon rebuildu. Proces
      # ostáva živý počas kontroly handle aj skutočného odstránenia databázy.
      - name: Build server for the Windows Node SQLite lifecycle gate
        run: pnpm --filter legalwork-server build
      - name: Node SQLite final release, overlapping owners and restart
        run: node --test apps/server/scripts/runtime-db-lifecycle.node.test.mjs
      - name: Node production engine proxy and idle response cancellation
        run: node --test apps/server/scripts/opencode-proxy-cancellation.node.test.mjs

      - name: Verify native ISIR bootstrap, diagnostics and owned resources
        run: node --test lawoss/testing/isir/native/*.test.mjs

      - name: ISIR attachments in ten case folders (synthetic offline corpus)
        run: pnpm test:isir
