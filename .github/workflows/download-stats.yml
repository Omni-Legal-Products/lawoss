name: Download Stats

# Snapshot GitHub release download counts and repo traffic (views, clones,
# referrers) into PostHog. GitHub only exposes lifetime cumulative download
# counts and deletes traffic data after 14 days — this preserves both as
# time series.

# LAWOSS: plánovaný beh je vypnutý, štatistiky sa nikam neposielajú
# automaticky. Ručné spustenie bez vars.LAWOSS_POSTHOG_KEY a
# vars.LAWOSS_POSTHOG_HOST skončí úspešne bez akejkoľvek HTTP požiadavky.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    # LAWOSS: štatistiky stiahnutí idú do PostHogu dodávateľa upstreamu; vo forku nikdy.
    if: github.repository == 'eigenweltlabs/legalwork'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Report release download stats to PostHog
        env:
          # Traffic endpoints need push access; release counters work with
          # the default Actions token. The optional LEGALWORK_STATS_TOKEN
          # secret name is kept unchanged. No upstream configuration is inherited.
          GITHUB_TOKEN: ${{ secrets.LEGALWORK_STATS_TOKEN || github.token }}
          # Without both explicit LAWOSS settings the script skips all HTTP.
          LAWOSS_POSTHOG_KEY: ${{ vars.LAWOSS_POSTHOG_KEY }}
          LAWOSS_POSTHOG_HOST: ${{ vars.LAWOSS_POSTHOG_HOST }}
        run: node scripts/release/report-download-stats.mjs
