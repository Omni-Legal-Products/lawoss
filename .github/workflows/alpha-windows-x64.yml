name: Alpha Channel (Windows x64)

# 🟡 LAWOSS: ručne spúšťaný (záložka Actions) build alfy LAWOSS pre Windows x64.
#
# Podľa alpha-macos-aarch64.yml: beh s `publish` vydá vlastný prerelease
# `alpha-windows-v<základ>-alpha.<beh>-<sha>` s inštalátorom a posunie manifest
# `latest.yml` na pevnom release `alpha-windows-latest`, z ktorého číta updater.
# Staršie alfy ostávajú dostupné. Build a podpis cez SignPath zodpovedajú
# stabilnému kanálu (.github/workflows/release-macos-aarch64.yml).
#
# Podpis (rozhodnutie tímu Q06/U6): verejné binárky len podpísané. Bez SignPath
# (prázdny SIGNPATH_PROJECT_SLUG) beh hneď na začiatku skončí, pokiaľ spúšťajúci
# výslovne nezvolí `allow_unsigned_internal`. Taký build je len pre interný tím:
# vyjde vždy ako koncept (draft) releasu, ktorý vidia len členovia s právom
# zápisu do repa, a nikdy neposunie verejný `alpha-windows-latest`, takže ho
# updater nikomu neponúkne. Názov konceptu začína „NEPODPÍSANÉ – len interný tím“
# a popis upozorní na SmartScreen a zákaz klientskych údajov. Nepodpísaný
# inštalátor teda nikdy nevyjde verejne ani potichu.
#
# `draft: true` vydá aj podpísaný build len ako koncept bez posunu ukazovateľa.
#
# `publish: false` len zostaví build a uloží ho ako artefakt behu (7 dní), bez
# releasu a bez posunu `alpha-windows-latest`. Artefakt behu v public repe
# stiahne ktokoľvek prihlásený na GitHube, preto je táto voľba len pre podpísaný
# build; nepodpísaný beh s `publish: false` hneď na začiatku skončí.
#
# Pozri:
#   - .github/workflows/alpha-macos-aarch64.yml (alfa pre macOS)
#   - .github/workflows/release-macos-aarch64.yml (stabilný kanál)
#   - docs/lawoss-d1-zabalena-appka-2026-10-05.md (návod pre testerov, Windows)

on:
  # Len ručne, zo záložky Actions.
  workflow_dispatch:
    inputs:
      base_version:
        description: "LAWOSS: alpha base X.Y.Z, e.g. 0.2.1 (overrides vars.LAWOSS_ALPHA_BASE_VERSION; empty = next patch after the latest v* tag)"
        required: false
        type: string
      draft:
        description: "LAWOSS: koncept (draft) vydanie bez aktualizácie ukazovateľa alfa kanála; testeri ho nedostanú automaticky"
        required: false
        type: boolean
        default: false
      allow_unsigned_internal:
        description: "LAWOSS: bez SignPath povoliť NEPODPÍSANÝ build len pre interný tím: vždy len koncept (draft) bez posunu ukazovateľa, SmartScreen, žiadne klientske údaje. Verejné binárky len podpísané."
        required: false
        type: boolean
        default: false
      publish:
        description: "LAWOSS: vydať prerelease a posunúť alpha-windows-latest. Vypnuté = len artefakt behu na 7 dní (len podpísaný build; artefakt v public repe je verejný)."
        required: false
        type: boolean
        default: true

permissions:
  contents: write

# 🟡 LAWOSS: všetky behy s `publish` zdieľajú jednu skupinu bez ohľadu na vetvu
# a čakajú v rade, lebo posúvajú ten istý `alpha-windows-latest`. Kontrola verzie
# pred posunom tak porovnáva s naozaj posledným ukazovateľom a zrušený beh
# nenechá vydanie v polovici. Build bez publikovania ruší starší build tej vetvy.
concurrency:
  group: ${{ inputs.publish && 'alpha-windows-x64-publish' || format('alpha-windows-x64-build-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.publish }}

jobs:
  publish-alpha-windows-x64:
    name: Build + Publish alpha (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      ALPHA_RELEASE_TAG: alpha-windows-latest
      ALPHA_RELEASE_NAME: LAWOSS Alpha (Windows x64)
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID || vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG || vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG || vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}

    steps:
      # 🟡 LAWOSS: rozhodnutie Q06/U6 — nepodpísaný build len pre interný tím a s
      # výslovným varovaním. Beží pred checkoutom, aby beh bez SignPath skončil
      # skôr, než sa hodinu stavia. Výstupy `signed` a `draft` čítajú kroky
      # releasu; nepodpísaný build je vždy koncept a nikdy neposunie ukazovateľ.
      - name: Require SignPath or an explicit unsigned internal build
        id: signing
        shell: bash
        env:
          ALLOW_UNSIGNED_INTERNAL: ${{ inputs.allow_unsigned_internal }}
          PUBLISH: ${{ inputs.publish }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          if [ -n "${SIGNPATH_PROJECT_SLUG:-}" ]; then
            echo "SignPath je nastavený; inštalátor sa podpíše."
            echo "signed=true" >> "$GITHUB_OUTPUT"
            if [ "${DRAFT:-false}" = "true" ]; then
              echo "draft=true" >> "$GITHUB_OUTPUT"
            else
              echo "draft=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ -n "${SIGNPATH_ARTIFACT_CONFIGURATION_SLUG:-}" ]; then
            echo "::warning title=Neúplná konfigurácia SignPath::SIGNPATH_ARTIFACT_CONFIGURATION_SLUG je nastavený, ale SIGNPATH_PROJECT_SLUG chýba. Bez neho sa nepodpisuje."
          fi
          if [ "${ALLOW_UNSIGNED_INTERNAL:-false}" != "true" ]; then
            echo "::error title=SignPath nie je nastavený::SIGNPATH_PROJECT_SLUG je prázdny, build by nebol podpísaný. Verejné binárky LAWOSS musia byť podpísané (rozhodnutie Q06/U6). Nepodpísaný build len pre interný tím spustite so vstupom allow_unsigned_internal=true; release dostane varovanie v názve aj v popise."
            exit 1
          fi
          if [ "${PUBLISH:-true}" != "true" ]; then
            echo "::error title=Nepodpísaný build nie ako artefakt behu::publish=false by nepodpísaný inštalátor uložil ako artefakt behu, ktorý v public repe stiahne ktokoľvek prihlásený na GitHube. Nepodpísaný build pre interný tím spustite s publish=true; vyjde len ako koncept (draft) bez posunu ukazovateľa."
            exit 1
          fi
          echo "::warning title=NEPODPÍSANÝ build::Bez SignPath, povolené cez allow_unsigned_internal. Len pre interný tím: vyjde len ako koncept (draft), ukazovateľ alpha-windows-latest sa neposunie, SmartScreen varuje, žiadne klientske údaje."
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "draft=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          # Full history so `git describe` can find the latest v* release tag —
          # alpha versions are derived from it (package.json is a placeholder).
          fetch-depth: 0

      - name: Enable git long paths (Windows)
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-electron-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve alpha version
        id: alpha-version
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          # LAWOSS: fork tags stop at v0.1.14 while dev already carries upstream
          # 0.2.x, so an explicit base keeps alpha versions in step with the code.
          ALPHA_BASE_VERSION: ${{ inputs.base_version || vars.LAWOSS_ALPHA_BASE_VERSION }}
        run: |
          set -euo pipefail
          # The latest v* tag reachable from this commit is the version source
          # of truth (package.json only carries a 0.0.0 placeholder). Alpha
          # builds advertise the *next* patch version so semver comparison
          # makes the alpha newer than the current stable. Once that stable
          # ships, its semver beats the alpha prerelease tag and alpha users
          # cleanly migrate forward.
          latest_tag="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v0.0.0)"
          base="${latest_tag#v}"
          base="${base%%[-+]*}"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $latest_tag" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$base"
          next_patch=$((patch + 1))
          alpha_base="${major}.${minor}.${next_patch}"
          explicit_base="${ALPHA_BASE_VERSION:-}"
          explicit_base="${explicit_base#v}"
          if [ -n "$explicit_base" ]; then
            if [[ ! "$explicit_base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid alpha base version: $explicit_base (expected X.Y.Z)" >&2
              exit 1
            fi
            IFS=. read -r emajor eminor epatch <<<"$explicit_base"
            if (( emajor < major || (emajor == major && (eminor < minor || (eminor == minor && epatch < next_patch))) )); then
              echo "Alpha base $explicit_base is lower than $alpha_base derived from $latest_tag; remove LAWOSS_ALPHA_BASE_VERSION or raise it." >&2
              exit 1
            fi
            alpha_base="$explicit_base"
          fi
          run="${GITHUB_RUN_NUMBER:-0}"
          sha="${GITHUB_SHA:0:7}"
          sha="${sha:-local}"
          echo "Latest release tag: $latest_tag -> alpha base ${alpha_base}"
          # The commit sha rides in the prerelease part (…-alpha.<run>.g<sha>),
          # not as +<sha> build metadata: pnpm refuses to workspace-link the
          # exact-pinned internal deps (legalwork-server, opencode-router) when
          # the stamped version carries build metadata, and falls back to the
          # public npm registry (404 / name-squatted package). The "g" prefix
          # (git describe's convention) keeps the identifier valid semver: a
          # sha made of digits only with a leading zero, such as 0904434, is
          # not a legal numeric prerelease identifier, and pnpm then cannot
          # match the workspace package either and falls back the same way.
          {
            echo "alpha_version=${alpha_base}-alpha.${run}.g${sha}"
            echo "base_version=${alpha_base}"
            echo "release_tag=alpha-windows-v${alpha_base}-alpha.${run}-${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp alpha version
        shell: bash
        env:
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
        # Lockfile-only resync keeps pnpm-lock.yaml consistent with the stamped
        # orchestrator dependency pins so later pnpm invocations don't reject
        # the workspace (installs stay explicit + frozen before this step).
        run: |
          node scripts/release/apply-version.mjs --version "$ALPHA_VERSION"
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Build Electron alpha app
        shell: bash
        env:
          # TARGET tells prepare-sidecar.mjs which architecture's sidecars
          # to download.
          TARGET: x86_64-pc-windows-msvc
          # The renderer bundle (vite build) peaks above Node's default heap.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @legalwork/desktop build:electron

      - name: Package Electron alpha (Windows)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            --win --x64 \
            --publish never

      # 🟡 LAWOSS: electron-build.mjs na win32 kontrolu importov pred zabalením
      # preskakuje (#126), tak ako v ci-desktop-packaging.yml beží nad skutočným
      # app.asar z win-unpacked, ktorý NSIS inštalátor obsahuje.
      - name: Verify packaged server modules load from app.asar
        shell: bash
        timeout-minutes: 10
        run: node apps/desktop/scripts/check-packaged-server-imports.mjs "apps/desktop/dist-electron/win-unpacked/resources/app.asar"

      - name: Validate SignPath configuration (Windows)
        if: env.SIGNPATH_PROJECT_SLUG != ''
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            SIGNPATH_API_TOKEN \
            SIGNPATH_ORGANIZATION_ID \
            SIGNPATH_PROJECT_SLUG \
            SIGNPATH_SIGNING_POLICY_SLUG; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing Windows SignPath configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Stage unsigned Windows installer for SignPath
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/signpath-unsigned"
          shopt -s nullglob
          installers=(apps/desktop/dist-electron/lawoss-win-x64-*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            printf 'Expected exactly one unsigned Windows installer, found %s.\n' "${#installers[@]}" >&2
            printf '%s\n' "${installers[@]}" >&2
            exit 1
          fi
          cp "${installers[0]}" "$RUNNER_TEMP/signpath-unsigned/"

      # 🟡 LAWOSS: bez SignPath by to bola len ďalšia verejná kópia nepodpísaného buildu.
      - name: Upload unsigned Windows installer for SignPath
        id: upload-unsigned-windows-installer
        if: env.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-legalwork-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signpath-unsigned/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit Windows signing request to SignPath
        if: env.SIGNPATH_PROJECT_SLUG != '' && env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG == ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      # 🟡 LAWOSS: aj projekt, nielen konfigurácia artefaktu; samotný artifact slug
      # by spustil podpis bez validácie a výsledok by sa nepoužil.
      - name: Submit Windows signing request to SignPath (artifact configuration)
        if: env.SIGNPATH_PROJECT_SLUG != '' && env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Apply signed Windows installer
        if: env.SIGNPATH_PROJECT_SLUG != ''
        shell: bash
        # Copies the signed installer back into dist-electron and rewrites the
        # sha512/size in latest.yml so the updater accepts the signed binary.
        run: node scripts/release/apply-signpath-windows-artifact.mjs "$RUNNER_TEMP/signpath-signed" apps/desktop/dist-electron

      # 🟡 LAWOSS: SHA-256 assetov až po podpise, teda presne tých, ktoré sa
      # nahrajú. Idú do súhrnu behu aj do popisu releasu.
      - name: Record SHA-256 of Windows assets
        id: asset-hashes
        shell: bash
        env:
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          DRAFT: ${{ steps.signing.outputs.draft }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/latest.yml
          )
          hashes="$RUNNER_TEMP/lawoss-alpha-windows-sha256.md"
          {
            echo "| Súbor | SHA-256 |"
            echo "| --- | --- |"
            for asset in "${assets[@]}"; do
              if [ ! -f "$asset" ]; then
                echo "Missing Windows alpha asset: $asset" >&2
                exit 1
              fi
              printf "| \`%s\` | \`%s\` |\n" "$(basename "$asset")" "$(sha256sum "$asset" | cut -d' ' -f1)"
            done
          } > "$hashes"
          {
            echo "## LAWOSS Alpha ${ALPHA_VERSION} (Windows x64)"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Inštalátor je podpísaný cez SignPath."
            else
              echo "**NEPODPÍSANÉ – len interný tím.** SmartScreen pri spustení varuje; žiadne klientske údaje."
            fi
            if [ "$DRAFT" = "true" ]; then
              echo
              echo "Koncept (draft): vidia ho len členovia s právom zápisu do repa; \`alpha-windows-latest\` sa neposúva."
            fi
            echo
            cat "$hashes"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "file=$hashes" >> "$GITHUB_OUTPUT"

      # 🟡 LAWOSS: `publish: false` = testovací build bez releasu a bez posunu
      # ukazovateľa; updater ho nikomu neponúkne. Artefakt behu je v public repe
      # verejný, preto sem nepodpísaný build nedôjde (brána `signing` ho zastaví).
      - name: Upload Windows test build as a run artifact (no release)
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: lawoss-alpha-windows-${{ steps.alpha-version.outputs.alpha_version }}${{ steps.signing.outputs.signed != 'true' && '-NEPODPISANE' || '' }}
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/latest.yml
          if-no-files-found: error
          retention-days: 7

      # 🟡 LAWOSS: ukazovateľ sa smie posunúť len na vyššiu verziu (semver), inak
      # by nižší `base_version` vrátil testerov na starší build. Rovnaká verzia
      # prejde len pri opakovaní toho istého behu (run_attempt > 1), keď sa assety
      # releasu prepíšu a ukazovateľ musí dostať ich nové sha512. Beží pred
      # vytvorením releasu, aby zamietnutý beh nenechal verejný prerelease.
      # Koncept (aj každý nepodpísaný build) ukazovateľ neposúva, kontrola odpadá.
      - name: Check alpha pointer version is newer
        id: pointer-guard
        if: ${{ inputs.publish && steps.signing.outputs.draft != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
        run: |
          set -euo pipefail
          current_dir="$RUNNER_TEMP/alpha-pointer-current"
          rm -rf "$current_dir"
          mkdir -p "$current_dir"
          CURRENT_MANIFEST=""
          if assets="$(gh release view "$ALPHA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>&1)"; then
            if printf '%s\n' "$assets" | grep -qx 'latest.yml'; then
              gh release download "$ALPHA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.yml --dir "$current_dir" --clobber
              CURRENT_MANIFEST="$current_dir/latest.yml"
            else
              echo "$ALPHA_RELEASE_TAG has no latest.yml yet; nothing to compare."
            fi
          elif printf '%s\n' "$assets" | grep -qi 'release not found'; then
            echo "$ALPHA_RELEASE_TAG does not exist yet; nothing to compare."
          else
            printf '%s\n' "$assets" >&2
            exit 1
          fi
          export CURRENT_MANIFEST
          node <<'NODE'
          const fs = require("node:fs");
          const next = process.env.ALPHA_VERSION;
          const manifest = process.env.CURRENT_MANIFEST;
          const parse = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(value ?? "");
            if (!match) throw new Error(`Not a semver version: ${JSON.stringify(value)}`);
            return { core: match.slice(1, 4).map(BigInt), pre: match[4] ? match[4].split(".") : [] };
          };
          const compareIdentifiers = (left, right) => {
            const leftNumeric = /^\d+$/.test(left);
            const rightNumeric = /^\d+$/.test(right);
            if (leftNumeric && rightNumeric) return BigInt(left) === BigInt(right) ? 0 : BigInt(left) < BigInt(right) ? -1 : 1;
            if (leftNumeric !== rightNumeric) return leftNumeric ? -1 : 1;
            return left === right ? 0 : left < right ? -1 : 1;
          };
          // Poradie podľa semver 2.0.0: jadro číselne, verzia bez prerelease je
          // vyššia, identifikátory prerelease zľava (čísla < text).
          const compare = (left, right) => {
            const a = parse(left);
            const b = parse(right);
            for (let index = 0; index < 3; index += 1) {
              if (a.core[index] !== b.core[index]) return a.core[index] < b.core[index] ? -1 : 1;
            }
            if (a.pre.length === 0 || b.pre.length === 0) return a.pre.length === b.pre.length ? 0 : a.pre.length === 0 ? 1 : -1;
            for (let index = 0; index < Math.min(a.pre.length, b.pre.length); index += 1) {
              const result = compareIdentifiers(a.pre[index], b.pre[index]);
              if (result !== 0) return result;
            }
            return Math.sign(a.pre.length - b.pre.length);
          };
          parse(next);
          if (!manifest) {
            console.log(`No current pointer; ${next} becomes the first Windows alpha.`);
            process.exit(0);
          }
          const line = fs.readFileSync(manifest, "utf8").split(/\r?\n/).find((entry) => /^version:/.test(entry));
          const current = line?.replace(/^version:\s*/, "").trim().replace(/^(['"])(.*)\1$/, "$2");
          if (!current) throw new Error(`${manifest} has no version line`);
          const order = compare(next, current);
          if (order > 0) {
            console.log(`Pointer ${current} -> ${next}`);
            process.exit(0);
          }
          if (order === 0 && Number(process.env.GITHUB_RUN_ATTEMPT ?? "1") > 1) {
            console.log(`Re-run of ${next}: the pointer is refreshed with the re-uploaded assets.`);
            process.exit(0);
          }
          console.log(`::error title=Alfa nie je novšia::${next} nie je vyššia verzia než aktuálny ukazovateľ ${process.env.ALPHA_RELEASE_TAG} (${current}). Zvýšte base_version alebo LAWOSS_ALPHA_BASE_VERSION; ukazovateľ ani release sa nemenia.`);
          process.exit(1);
          NODE

      - name: Create immutable alpha prerelease
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
          # 🟡 LAWOSS: názov a popis podľa podpisu (Q06/U6) a so SHA-256 assetov;
          # nepodpísaný build je vždy koncept (draft), viditeľný len tímu s právom zápisu.
          SIGNED: ${{ steps.signing.outputs.signed }}
          DRAFT: ${{ steps.signing.outputs.draft }}
          ASSET_HASHES: ${{ steps.asset-hashes.outputs.file }}
        run: |
          set -euo pipefail
          title="LAWOSS Alpha ${ALPHA_VERSION} (Windows x64)"
          notes="$RUNNER_TEMP/alpha-release-notes.md"
          {
            if [ "$SIGNED" != "true" ]; then
              title="NEPODPÍSANÉ – len interný tím · ${title}"
              cat <<'EOF'
          > [!WARNING]
          > **NEPODPÍSANÝ build – len pre interný tím LAWOSS.**
          >
          > - Inštalátor nie je podpísaný. Windows SmartScreen pri spustení zobrazí „Windows protected your PC“; spustíte ho cez **More info → Run anyway**.
          > - Určené výhradne interným testerom. Ďalej ho nešírte.
          > - Žiadne klientske ani iné dôverné údaje, len vymyslené alebo verejné.

          EOF
            fi
            echo "Priebežná alfa LAWOSS ${ALPHA_VERSION} (Windows x64) z commitu ${GITHUB_SHA}."
            if [ "$SIGNED" = "true" ]; then
              echo "Inštalátor je podpísaný cez SignPath."
            fi
            if [ "$DRAFT" = "true" ]; then
              echo
              echo "Koncept (draft): vidia ho len členovia s právom zápisu do repa. Updater ho neponúka, \`alpha-windows-latest\` sa neposunul."
            fi
            echo
            echo "Beh: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "### SHA-256"
            echo
            cat "$ASSET_HASHES"
            echo
            echo "Overenie v PowerShelli: \`Get-FileHash .\\<súbor> -Algorithm SHA256\`"
          } > "$notes"
          if gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Opakovaný beh prepíše assety (--clobber), preto aj názov a popis s hashmi.
            echo "Alpha prerelease $ALPHA_RUN_RELEASE_TAG already exists; reusing it."
            gh release edit "$ALPHA_RUN_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$notes"
            exit 0
          fi
          release_flags=(--prerelease)
          if [ "$DRAFT" = "true" ]; then
            release_flags+=(--draft)
          fi
          gh release create "$ALPHA_RUN_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file "$notes" \
            --target "$GITHUB_SHA" \
            "${release_flags[@]}"

      - name: Upload Electron alpha updater assets
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/latest.yml
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Electron alpha assets found in apps/desktop/dist-electron" >&2
            exit 1
          fi
          gh release upload "$ALPHA_RUN_RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Update alpha updater pointer
        # LAWOSS: koncept nemení ukazovateľ alfa kanála; nepodpísaný build je vždy
        # koncept (Q06/U6), takže verejný ukazovateľ nikdy nemieri na nepodpísaný.
        if: ${{ inputs.publish && steps.signing.outputs.draft != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          POINTER_MANIFEST="$RUNNER_TEMP/latest.yml"
          export POINTER_MANIFEST
          node <<'NODE'
          const fs = require("node:fs");
          const manifestPath = "apps/desktop/dist-electron/latest.yml";
          const releaseTag = process.env.ALPHA_RUN_RELEASE_TAG;
          // LAWOSS: the pointer must reference the repository the assets were
          // just uploaded to, and the lawoss- artifactName from electron-builder.yml.
          const baseUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/releases/download/${releaseTag}`;
          const rewritten = fs.readFileSync(manifestPath, "utf8")
            .replace(/(url:\s*)(lawoss-[^\n]+)/g, `$1${baseUrl}/$2`)
            .replace(/(path:\s*)(lawoss-[^\n]+)/g, `$1${baseUrl}/$2`);
          fs.writeFileSync(process.env.POINTER_MANIFEST, rewritten);
          NODE

          # 🟡 LAWOSS: názov a popis ukazovateľa hovoria, kam práve mieri a či je
          # tá alfa podpísaná; ukazovateľ je verejný, inštalátor má len jeho release.
          pointer_title="$ALPHA_RELEASE_NAME"
          pointer_notes="$RUNNER_TEMP/alpha-pointer-notes.md"
          {
            echo "Ukazovateľ updatera pre najnovšiu alfu LAWOSS (Windows x64). Obsahuje len \`latest.yml\`; inštalátor ${ALPHA_VERSION} je v releasi [${ALPHA_RUN_RELEASE_TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${ALPHA_RUN_RELEASE_TAG})."
            if [ "$SIGNED" != "true" ]; then
              pointer_title="NEPODPÍSANÉ – len interný tím · ${ALPHA_RELEASE_NAME}"
              echo
              echo "> [!WARNING]"
              echo "> Aktuálna alfa je NEPODPÍSANÁ – len pre interný tím. SmartScreen varuje; žiadne klientske údaje."
            fi
          } > "$pointer_notes"

          if ! gh release view "$ALPHA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$ALPHA_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$pointer_title" \
              --notes-file "$pointer_notes" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi

          gh release upload "$ALPHA_RELEASE_TAG" "$POINTER_MANIFEST#latest.yml" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit "$ALPHA_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$pointer_title" \
            --notes-file "$pointer_notes"
