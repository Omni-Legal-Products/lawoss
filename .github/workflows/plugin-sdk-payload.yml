name: Fixed plugin SDK Windows artifact
on:
  pull_request:
    paths:
      - 'lawoss/build/plugin-payload/**'
      - '.github/workflows/plugin-sdk-payload.yml'
permissions:
  contents: read
concurrency:
  group: plugin-sdk-payload-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  windows-artifact:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      LAWOSS_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      LAWOSS_CHECKOUT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - id: payload-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
          package_json_file: lawoss/build/plugin-payload/tools/package.json
          run_install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Assert tools and install only the frozen standalone tool closure
        env:
          LAWOSS_PNPM_DEST: ${{ steps.payload-pnpm.outputs.dest }}
        run: |
          try {
            $payloadPnpmDest = $env:LAWOSS_PNPM_DEST
            $payloadNode = (Get-Command node -CommandType Application -TotalCount 1 -ErrorAction Stop).Source
            if ($payloadPnpmDest -isnot [string] -or [string]::IsNullOrWhiteSpace($payloadPnpmDest) -or -not [IO.Path]::IsPathFullyQualified($payloadPnpmDest)) { throw 'TOOLS_INSTALL_FAILED' }
            if ($payloadNode -isnot [string] -or [string]::IsNullOrWhiteSpace($payloadNode) -or -not [IO.Path]::IsPathFullyQualified($payloadNode)) { throw 'TOOLS_INSTALL_FAILED' }
            # The action dest locates the genuine package; bind its fixed CLI to captured Node.
            $payloadPnpmPackage = Join-Path $payloadPnpmDest 'node_modules/pnpm'
            $payloadPnpmManifestPath = Join-Path $payloadPnpmPackage 'package.json'
            $payloadPnpmCli = Join-Path $payloadPnpmPackage 'bin/pnpm.mjs'
            $payloadPnpmManifestFile = Get-Item -LiteralPath $payloadPnpmManifestPath -ErrorAction Stop
            if ($payloadPnpmManifestFile -isnot [IO.FileInfo] -or $payloadPnpmManifestFile.Length -le 0 -or $payloadPnpmManifestFile.Length -gt 65536) { throw 'TOOLS_INSTALL_FAILED' }
            $payloadPnpmManifestBytes = [IO.File]::ReadAllBytes($payloadPnpmManifestPath)
            if ($payloadPnpmManifestBytes.Length -gt 65536) { throw 'TOOLS_INSTALL_FAILED' }
            $payloadPnpmManifestText = [Text.UTF8Encoding]::new($false, $true).GetString($payloadPnpmManifestBytes)
            $payloadPnpmManifest = ConvertFrom-Json -InputObject $payloadPnpmManifestText -AsHashtable -NoEnumerate -ErrorAction Stop
            if ($payloadPnpmManifest -isnot [Collections.IDictionary]) { throw 'TOOLS_INSTALL_FAILED' }
            if ($payloadPnpmManifest.name -isnot [string] -or $payloadPnpmManifest.name -cne 'pnpm' -or $payloadPnpmManifest.version -isnot [string] -or $payloadPnpmManifest.version -cne '11.4.0') { throw 'TOOLS_INSTALL_FAILED' }
            if ($payloadPnpmManifest.bin -isnot [Collections.IDictionary] -or $payloadPnpmManifest.bin.pnpm -isnot [string] -or $payloadPnpmManifest.bin.pnpm -cne 'bin/pnpm.mjs') { throw 'TOOLS_INSTALL_FAILED' }
            if ((Get-Item -LiteralPath $payloadPnpmCli -ErrorAction Stop) -isnot [IO.FileInfo]) { throw 'TOOLS_INSTALL_FAILED' }
          } catch { throw 'TOOLS_INSTALL_FAILED' }
          if ((& $payloadNode --version) -ne 'v24.21.0') { throw 'NODE_VERSION' }
          $payloadPnpmVersion = (& $payloadNode $payloadPnpmCli --version).Trim()
          if ($payloadPnpmVersion -ne '11.4.0') { throw 'PNPM_VERSION' }
          if ((bun --version) -ne '1.3.14') { throw 'BUN_VERSION' }
          "LAWOSS_PNPM_VERSION=$payloadPnpmVersion" >> $env:GITHUB_ENV
          $payloadRoot = & $payloadNode -e "console.log(require('node:path').resolve('lawoss/build/plugin-payload'))"
          $payloadHome = Join-Path $payloadRoot '.work/tool-home'
          New-Item -ItemType Directory -Path $payloadHome -Force | Out-Null
          $payloadConfig = Join-Path $payloadRoot '.work/empty-tool-npmrc'
          New-Item -ItemType File -Path $payloadConfig | Out-Null
          # Isolate install configuration; setup acquisition is separate from SDK priming.
          $payloadPath = $env:PATH
          $payloadPathExt = $env:PATHEXT
          $payloadSystemRoot = $env:SystemRoot
          $payloadComSpec = $env:ComSpec
          Get-ChildItem Env: | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          $env:PATH = $payloadPath
          $env:PATHEXT = $payloadPathExt
          $env:SystemRoot = $payloadSystemRoot
          $env:ComSpec = $payloadComSpec
          $env:HOME = $payloadHome
          $env:USERPROFILE = $payloadHome
          $env:APPDATA = Join-Path $payloadHome 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $payloadHome 'AppData/Local'
          $env:XDG_CONFIG_HOME = Join-Path $payloadHome 'config'
          $env:TEMP = Join-Path $payloadRoot '.work'
          $env:TMP = $env:TEMP
          $env:npm_config_userconfig = $payloadConfig
          $env:npm_config_globalconfig = $payloadConfig
          $env:npm_config_cache = Join-Path $payloadRoot '.work/tool-cache'
          $payloadTools = Join-Path $payloadRoot 'tools'
          $payloadStore = Join-Path $payloadRoot '.work/tool-store'
          $payloadCache = Join-Path $payloadRoot '.work/tool-cache'
          $payloadState = Join-Path $payloadRoot '.work/tool-state'
          $payloadSanitizedOutput = @()
          $payloadSanitizedThrew = $false
          $payloadSanitizedExit = $null
          $global:LASTEXITCODE = $null
          try {
            $payloadSanitizedOutput = @(& $payloadNode $payloadPnpmCli --version 2>$null)
            $payloadSanitizedExit = $LASTEXITCODE
          } catch { $payloadSanitizedExit = $LASTEXITCODE; $payloadSanitizedThrew = $true }
          $payloadSanitizedVersion = 'other'
          if ($payloadSanitizedThrew) { $payloadSanitizedVersion = 'threw' }
          elseif ($payloadSanitizedOutput.Count -eq 0) { $payloadSanitizedVersion = 'absent' }
          elseif ($payloadSanitizedOutput.Count -eq 1 -and $payloadSanitizedOutput[0] -is [string] -and $payloadSanitizedOutput[0] -ceq '11.4.0') { $payloadSanitizedVersion = 'exact' }
          $payloadSanitizedExitKind = 'other'
          $payloadSanitizedExitValue = 'unknown'
          if ($null -eq $payloadSanitizedExit) { $payloadSanitizedExitKind = 'absent' }
          elseif ($payloadSanitizedExit -is [int]) { $payloadSanitizedExitKind = 'int32'; $payloadSanitizedExitValue = $payloadSanitizedExit.ToString([Globalization.CultureInfo]::InvariantCulture) }
          Write-Output "LAWOSS_PNPM_SANITIZED_VERSION:${payloadSanitizedVersion}:${payloadSanitizedExitKind}:${payloadSanitizedExitValue}"
          $global:LASTEXITCODE = $null
          try {
            & $payloadNode $payloadPnpmCli --dir $payloadTools install --prod=false --frozen-lockfile --ignore-workspace --ignore-scripts --registry=https://registry.npmjs.org/ --store-dir $payloadStore --config.cache-dir $payloadCache --config.state-dir $payloadState
            $payloadInstallExit = $LASTEXITCODE
          } catch { throw 'TOOLS_INSTALL_FAILED' }
          if ($null -eq $payloadInstallExit) {
            Write-Output 'LAWOSS_TOOLS_INSTALL_EXIT:absent:unknown'
          } elseif ($payloadInstallExit -is [int]) {
            Write-Output "LAWOSS_TOOLS_INSTALL_EXIT:int32:$($payloadInstallExit.ToString([Globalization.CultureInfo]::InvariantCulture))"
          } else {
            Write-Output 'LAWOSS_TOOLS_INSTALL_EXIT:other:unknown'
          }
          if ($payloadInstallExit -isnot [int] -or $payloadInstallExit -ne 0) { throw 'TOOLS_INSTALL_FAILED' }
          $global:LASTEXITCODE = $null
          try {
            & $payloadNode (Join-Path $payloadRoot 'tools-preflight.mjs')
            $payloadPreflightExit = $LASTEXITCODE
          } catch { throw 'TOOLS_ADMISSION_FAILED' }
          if ($payloadPreflightExit -isnot [int] -or $payloadPreflightExit -ne 0) { throw 'TOOLS_ADMISSION_FAILED' }
      - name: 44 offline units, finite SDK prime, guarded Node replay and separate Bun smoke
        run: |
          $payloadBun = (Get-Command bun -CommandType Application -TotalCount 1 -ErrorAction Stop).Source
          if ($payloadBun -isnot [string] -or -not [IO.Path]::IsPathFullyQualified($payloadBun)) { throw 'TOOLS_ADMISSION_FAILED' }
          node lawoss/build/plugin-payload/native-validation.mjs $payloadBun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload only closed small summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-sdk-windows-artifact-summary
          path: lawoss/build/plugin-payload/.work/windows-summary.json
          if-no-files-found: ignore
          retention-days: 7
