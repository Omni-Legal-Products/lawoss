name: Engine npm configuration Node 22
on:
  pull_request:
    paths:
      - 'lawoss/engine-dependencies/**'
      - '.github/workflows/engine-npm-config.yml'
permissions:
  contents: read
concurrency:
  group: engine-npm-config-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-config:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - id: config-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
          package_json_file: lawoss/engine-dependencies/runtime-tools/package.json
          run_install: false
      - name: Install only frozen runtime tools using captured Node 24
        env:
          LAWOSS_PNPM_DEST: ${{ steps.config-pnpm.outputs.dest }}
        run: |
          try {
            $configPnpmDest = $env:LAWOSS_PNPM_DEST
            $configNode = (Get-Command node -CommandType Application -TotalCount 1 -ErrorAction Stop).Source
            if ($configPnpmDest -isnot [string] -or [string]::IsNullOrWhiteSpace($configPnpmDest) -or -not [IO.Path]::IsPathFullyQualified($configPnpmDest)) { throw 'TOOLS_INSTALL_FAILED' }
            if ($configNode -isnot [string] -or [string]::IsNullOrWhiteSpace($configNode) -or -not [IO.Path]::IsPathFullyQualified($configNode)) { throw 'TOOLS_INSTALL_FAILED' }
            # The action dest locates the genuine package; bind its fixed CLI to captured Node.
            $configPnpmPackage = Join-Path $configPnpmDest 'node_modules/pnpm'
            $configPnpmManifestPath = Join-Path $configPnpmPackage 'package.json'
            $configPnpmCli = Join-Path $configPnpmPackage 'bin/pnpm.mjs'
            $configPnpmManifestFile = Get-Item -LiteralPath $configPnpmManifestPath -ErrorAction Stop
            if ($configPnpmManifestFile -isnot [IO.FileInfo] -or $configPnpmManifestFile.Length -le 0 -or $configPnpmManifestFile.Length -gt 65536) { throw 'TOOLS_INSTALL_FAILED' }
            $configPnpmManifestBytes = [IO.File]::ReadAllBytes($configPnpmManifestPath)
            if ($configPnpmManifestBytes.Length -gt 65536) { throw 'TOOLS_INSTALL_FAILED' }
            $configPnpmManifestText = [Text.UTF8Encoding]::new($false, $true).GetString($configPnpmManifestBytes)
            $configPnpmManifest = ConvertFrom-Json -InputObject $configPnpmManifestText -AsHashtable -NoEnumerate -ErrorAction Stop
            if ($configPnpmManifest -isnot [Collections.IDictionary]) { throw 'TOOLS_INSTALL_FAILED' }
            if ($configPnpmManifest.name -isnot [string] -or $configPnpmManifest.name -cne 'pnpm' -or $configPnpmManifest.version -isnot [string] -or $configPnpmManifest.version -cne '11.4.0') { throw 'TOOLS_INSTALL_FAILED' }
            if ($configPnpmManifest.bin -isnot [Collections.IDictionary] -or $configPnpmManifest.bin.pnpm -isnot [string] -or $configPnpmManifest.bin.pnpm -cne 'bin/pnpm.mjs') { throw 'TOOLS_INSTALL_FAILED' }
            if ((Get-Item -LiteralPath $configPnpmCli -ErrorAction Stop) -isnot [IO.FileInfo]) { throw 'TOOLS_INSTALL_FAILED' }
          } catch { throw 'TOOLS_INSTALL_FAILED' }
          $configRoot = Join-Path $env:GITHUB_WORKSPACE 'lawoss/engine-dependencies'
          $configTools = Join-Path $configRoot 'runtime-tools'
          $configOwned = Join-Path $configRoot '.work/ci-tools'
          $configHome = Join-Path $configOwned 'home'
          $configUser = Join-Path $configOwned 'user.npmrc'
          $configGlobal = Join-Path $configOwned 'global.npmrc'
          $configCache = Join-Path $configOwned 'cache'
          $configStore = Join-Path $configOwned 'store'
          $configState = Join-Path $configOwned 'state'
          New-Item -ItemType Directory -Path $configHome -Force | Out-Null
          [IO.File]::WriteAllText($configUser, '')
          [IO.File]::WriteAllText($configGlobal, '')
          # Installer-only isolation. Keep the OS executable environment intact.
          Get-ChildItem Env: | Where-Object { $_.Name -ieq 'NODE_OPTIONS' -or $_.Name -ilike 'npm_config*' -or $_.Name -ilike 'pnpm_*' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          $env:HOME = $configHome
          $env:USERPROFILE = $configHome
          $env:APPDATA = Join-Path $configHome 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $configHome 'AppData/Local'
          $env:XDG_CONFIG_HOME = Join-Path $configHome 'config'
          $env:XDG_CACHE_HOME = $configCache
          $env:XDG_DATA_HOME = Join-Path $configHome 'data'
          $env:XDG_STATE_HOME = $configState
          $env:npm_config_userconfig = $configUser
          $env:npm_config_globalconfig = $configGlobal
          $env:npm_config_cache = $configCache
          $global:LASTEXITCODE = $null
          try { $configNodeVersion = @(& $configNode --version); $configNodeExit = $LASTEXITCODE } catch { throw 'TOOLS_INSTALL_FAILED' }
          if ($configNodeExit -isnot [int] -or $configNodeExit -ne 0 -or $configNodeVersion.Count -ne 1 -or $configNodeVersion[0] -cne 'v24.21.0') { throw 'TOOLS_INSTALL_FAILED' }
          $global:LASTEXITCODE = $null
          try { $configVersion = @(& $configNode $configPnpmCli --version); $configVersionExit = $LASTEXITCODE } catch { throw 'TOOLS_INSTALL_FAILED' }
          if ($configVersionExit -isnot [int] -or $configVersionExit -ne 0 -or $configVersion.Count -ne 1 -or $configVersion[0] -cne '11.4.0') { throw 'TOOLS_INSTALL_FAILED' }
          $global:LASTEXITCODE = $null
          try {
            & $configNode $configPnpmCli --dir $configTools install --ignore-workspace --ignore-scripts --frozen-lockfile --prod=false --registry=https://registry.npmjs.org --store-dir $configStore "--config.cache-dir=$configCache" "--config.state-dir=$configState"
            $configInstallExit = $LASTEXITCODE
          } catch { throw 'TOOLS_INSTALL_FAILED' }
          if ($configInstallExit -isnot [int] -or $configInstallExit -ne 0) { throw 'TOOLS_INSTALL_FAILED' }
          $portableScratch = Join-Path $configOwned 'portable-build'
          $portableStore = Join-Path $portableScratch 'store'
          $portableOutput = Join-Path $configOwned 'portable-runtime'
          # Copy the already acquired store into a separate owned build root.
          $global:LASTEXITCODE = $null
          & $configNode --input-type=module -e "import {prepareScratch} from './lawoss/engine-dependencies/package-runtime.mjs'; await prepareScratch(process.argv[1]);" $portableScratch
          if ($LASTEXITCODE -isnot [int] -or $LASTEXITCODE -ne 0) { throw 'PORTABLE_INIT_FAILED' }
          Copy-Item -LiteralPath $configStore -Destination $portableStore -Recurse -ErrorAction Stop
          $global:LASTEXITCODE = $null
          & $configNode (Join-Path $configRoot 'package-runtime.mjs') $portableOutput $portableScratch $portableStore $configPnpmCli offline
          if ($LASTEXITCODE -isnot [int] -or $LASTEXITCODE -ne 0) { throw 'PORTABLE_STAGE_FAILED' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Assert actual Node 22 and run native merged graph validation
        run: |
          $global:LASTEXITCODE = $null
          $configTestVersion = @(node --version)
          $configTestVersionExit = $LASTEXITCODE
          if ($configTestVersionExit -isnot [int] -or $configTestVersionExit -ne 0 -or $configTestVersion.Count -ne 1 -or $configTestVersion[0] -cne 'v22.23.2') { throw 'NODE_VERSION' }
          $global:LASTEXITCODE = $null
          node --test lawoss/engine-dependencies/package-runtime.test.mjs
          if ($LASTEXITCODE -isnot [int] -or $LASTEXITCODE -ne 0) { throw 'PORTABLE_TEST_FAILED' }
          $global:LASTEXITCODE = $null
          node lawoss/engine-dependencies/relocation-smoke.mjs lawoss/engine-dependencies/.work/ci-tools/portable-runtime lawoss/engine-dependencies/.work/ci-tools
          if ($LASTEXITCODE -isnot [int] -or $LASTEXITCODE -ne 0) { throw 'PORTABLE_RELOCATION_FAILED' }
          $global:LASTEXITCODE = $null
          node --test lawoss/engine-dependencies/native-merged-validation.test.mjs
          $configGuardExit = $LASTEXITCODE
          if ($configGuardExit -isnot [int] -or $configGuardExit -ne 0) { throw 'NATIVE_GUARD_TEST_FAILED' }
          $global:LASTEXITCODE = $null
          node lawoss/engine-dependencies/native-merged-validation.mjs
          $configTestExit = $LASTEXITCODE
          if ($configTestExit -isnot [int] -or $configTestExit -ne 0) { throw 'CONFIG_TEST_FAILED' }
