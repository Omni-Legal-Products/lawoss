name: Plugin SDK shipped Node compatibility
on:
  pull_request:
    paths:
      - 'lawoss/build/plugin-payload/**'
      - 'lawoss/engine-dependencies/package-runtime.mjs'
      - '.github/workflows/plugin-sdk-runtime.yml'
permissions:
  contents: read
concurrency:
  group: plugin-sdk-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  runtime-consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      LAWOSS_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      LAWOSS_CHECKOUT_SHA: ${{ github.sha }}
      LAWOSS_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Capture the native consumer executable
        run: >-
          node -e "if(process.version!=='v22.23.2'||process.arch!==process.env.LAWOSS_TARGET_ARCH)process.exit(1);
          require('node:fs').appendFileSync(process.env.GITHUB_ENV,'LAWOSS_CONSUMER_NODE='+process.execPath+'\n')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - id: payload-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
          package_json_file: lawoss/build/plugin-payload/tools/package.json
          run_install: false
      - name: Prepare and verify a genuine payload with both native Node versions
        env:
          LAWOSS_PNPM_DEST: ${{ steps.payload-pnpm.outputs.dest }}
        run: >-
          node --input-type=module -e "
          import path from 'node:path';
          import { validateRuntimeConsumer } from './lawoss/build/plugin-payload/runtime-consumer-validation.mjs';
          if(process.version!=='v24.21.0'||process.arch!==process.env.LAWOSS_TARGET_ARCH)process.exit(1);
          const dest=process.env.LAWOSS_PNPM_DEST;
          if(!dest||!path.isAbsolute(dest))process.exit(1);
          const result=await validateRuntimeConsumer(process.env.LAWOSS_CONSUMER_NODE,path.join(dest,'node_modules/pnpm/bin/pnpm.mjs'));
          console.log(JSON.stringify({status:result.status,stage:result.failedStage,code:result.code}));
          if(result.status!=='complete')process.exitCode=1;"
      - name: Upload finite dependency compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-runtime-${{ matrix.runner }}-${{ matrix.arch }}
          path: lawoss/build/plugin-payload/.work/runtime-consumer-summary.json
          if-no-files-found: warn
          retention-days: 7
