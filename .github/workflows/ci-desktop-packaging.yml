name: Desktop Package Smoke Tests

on:
  # 🟡 LAWOSS: balenie a štart zabalenej appky (ISIR native, kontrola app.asar) beží na každom PR
  # a pushe do dev; „Package and launch“ sú povinné kontroly rulesetu dev. Upstream ho spúšťa len cez workflow_call.
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_call:
    inputs:
      runtime_provided:
        description: Volajúci workflow už pripravil artefakty sandbox-runtime-<platform>-<arch>
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # 🟡 LAWOSS: pri samostatnom behu (PR, push) si balenie runtime izolovaného prostredia
  # postaví samo, len pre platformy z matice a bez sandbox testov (tie bežia v ci-tests).
  sandbox-runtime:
    if: ${{ !inputs.runtime_provided }}
    uses: ./.github/workflows/sandbox-runtime.yml
    with:
      targets: linux-x64,linux-arm64,win32-x64,win32-arm64,darwin-x64,darwin-arm64
      run_tests: false
  package-smoke:
    name: Package and launch (${{ matrix.os }})
    needs: sandbox-runtime
    if: ${{ !cancelled() && (needs.sandbox-runtime.result == 'success' || needs.sandbox-runtime.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            executable: linux-unpacked/legalwork
            asar: linux-unpacked/resources/app.asar
            securityTarget: linux-unpacked/legalwork
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win
            arch: x64
            executable: win-unpacked/LAWOSS.exe
            asar: win-unpacked/resources/app.asar
            securityTarget: win-unpacked/LAWOSS.exe
          - os: macos-14
            target: aarch64-apple-darwin
            platform: mac
            arch: arm64
            executable: mac-arm64/LAWOSS.app/Contents/MacOS/LAWOSS
            asar: mac-arm64/LAWOSS.app/Contents/Resources/app.asar
            securityTarget: mac-arm64/LAWOSS.app
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: win
            arch: arm64
            executable: win-arm64-unpacked/LAWOSS.exe
            asar: win-arm64-unpacked/resources/app.asar
            securityTarget: win-arm64-unpacked/LAWOSS.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: mac
            arch: x64
            executable: mac/LAWOSS.app/Contents/MacOS/LAWOSS
            asar: mac/LAWOSS.app/Contents/Resources/app.asar
            securityTarget: mac/LAWOSS.app
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            executable: linux-arm64-unpacked/legalwork
            asar: linux-arm64-unpacked/resources/app.asar
            securityTarget: linux-arm64-unpacked/legalwork
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MACOS_NOTARIZE: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Verify native runner architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Desktop smoke requires native ${{ matrix.arch }} Node; got ' + process.arch)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test desktop platform coverage
        if: runner.os != 'Windows'
        run: node --test lawoss/testing/desktop-platform-matrix.test.mjs lawoss/testing/alpha/*.test.mjs
      - name: Test desktop platform coverage with native Windows process ownership
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveTool = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (!(Test-Path -LiteralPath $archiveTool -PathType Leaf)) { throw 'Full 7-Zip with NSIS support is required for alpha integrity tests' }
          $env:ELECTRON_BUILDER_7ZIP_PATH = $archiveTool
          node --test lawoss/testing/desktop-platform-matrix.test.mjs lawoss/testing/alpha/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test config migration, token-file migration and link policy
        run: node --test apps/desktop/electron/opencode-config-migration.test.mjs apps/desktop/electron/runtime.test.mjs apps/desktop/electron/ui-control-server.test.mjs apps/desktop/electron/safe-open.test.mjs
      - uses: actions/download-artifact@v4
        with:
          # LAWOSS: matica má aj macOS (platform mac); runtime sa volá darwin-<arch>.
          name: sandbox-runtime-${{ matrix.platform == 'win' && 'win32' || matrix.platform == 'mac' && 'darwin' || matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/sandbox-runtime
      - name: Unpack protected runtime
        shell: bash
        run: |
          mkdir -p apps/server/resources/agent-sandbox/runtime
          archive="$RUNNER_TEMP/sandbox-runtime/sandbox-runtime.tgz"
          if [ "$RUNNER_OS" = Windows ]; then archive="$(cygpath -u "$archive")"; fi
          tar -xzf "$archive" -C apps/server/resources/agent-sandbox/runtime

      - name: Build desktop app and native dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @legalwork/desktop build:electron
      # Real isolated dev renderer + pinned sidecar + provider protocol fixture.
      # The packaged CDP prohibition stays covered by the existing security gate.
      - name: Enable synthetic-only native diagnostic artifact
        run: |
          echo "LAWOSS_ISIR_NATIVE_DIAGNOSTICS=1" >> "$GITHUB_ENV"
          echo "LAWOSS_ISIR_NATIVE_DIAGNOSTICS_FILE=$RUNNER_TEMP/isir-native-diagnostics.json" >> "$GITHUB_ENV"
      # Ten independent 240s provision + 90s inference windows can consume 55min.
      # Allow the complete batch plus fixtures, attachment and cold recovery;
      # every individual deadline and positive oracle stays in the harness.
      - name: Native ISIR renderer, tools and application relaunch (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 75
        run: xvfb-run -a pnpm test:isir:native
      - name: Native ISIR renderer, tools and application relaunch (Windows and macOS)
        id: native-isir-non-linux
        if: runner.os != 'Linux'
        timeout-minutes: 75
        run: pnpm test:isir:native
      - name: Probe bundled engine runtime after Windows native failure
        if: runner.os == 'Windows' && failure() && steps.native-isir-non-linux.outcome == 'failure'
        run: node lawoss/testing/isir/native/engine-runtime-smoke.mjs "${{ runner.temp }}/isir-engine-runtime-smoke.json"
      - name: Upload synthetic engine runtime metadata
        if: runner.os == 'Windows' && failure() && steps.native-isir-non-linux.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: isir-engine-runtime-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/isir-engine-runtime-smoke.json
          if-no-files-found: ignore
          retention-days: 7
      # Only the allowlisted projection is uploaded; never the private test root.
      - name: Upload synthetic native boundary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isir-native-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/isir-native-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Package desktop app
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }} ${{ runner.os == 'macOS' && '-c.mac.identity=-' || '' }} --dir --publish never
      # LAWOSS: importuje každý modul servera priamo zo zabaleného app.asar (Electron ako Node).
      - name: Verify packaged server modules load from app.asar
        run: node apps/desktop/scripts/check-packaged-server-imports.mjs "apps/desktop/dist-electron/${{ matrix.asar }}"
      - name: Verify Linux AppImage packaging
        if: runner.os == 'Linux'
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --linux AppImage --${{ matrix.arch }} --prepackaged "dist-electron/${{ matrix.arch == 'arm64' && 'linux-arm64-unpacked' || 'linux-unpacked' }}" --publish never
      - name: Verify shipped fuses, Node and document tools
        run: pnpm --dir apps/desktop check:packaged-security "dist-electron/${{ matrix.securityTarget }}"
      - name: Run isolation probe with the packaged Node and VM
        run: |
          bun build scripts/sandbox/probe.ts --target=node --outfile=scripts/sandbox/probe.mjs
          node scripts/sandbox/probe-packaged.mjs "apps/desktop/dist-electron/${{ matrix.securityTarget }}"
      - name: Verify Windows and macOS native modules
        if: runner.os != 'Linux'
        timeout-minutes: 2
        run: pnpm --dir apps/desktop test:native
      - name: Verify Windows and macOS preview isolation
        if: runner.os != 'Linux'
        timeout-minutes: 2
        run: pnpm --dir apps/desktop test:preview-security
      - name: Verify Windows and macOS packaged startup
        if: runner.os != 'Linux'
        timeout-minutes: 3
        run: node apps/desktop/scripts/packaged-startup-regression.mjs "apps/desktop/dist-electron/${{ matrix.executable }}"
      - name: Verify Windows installer packaging
        if: runner.os == 'Windows'
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win --${{ matrix.arch }} --prepackaged "dist-electron/${{ matrix.arch == 'arm64' && 'win-arm64-unpacked' || 'win-unpacked' }}" --publish never
      # Only the finite integrity receipt is uploaded, never unsigned binaries.
      - name: Verify actual Windows NSIS installation and final bytes
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 12
        run: ./lawoss/testing/alpha/probe-nsis-ci.ps1 -Arch '${{ matrix.arch }}' -NativeStartup -Output "$env:RUNNER_TEMP/nsis-proof-${{ matrix.arch }}.json"
      - name: Upload Windows installed-tree integrity receipt
        if: runner.os == 'Windows' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: nsis-installed-tree-${{ matrix.arch }}
          path: ${{ runner.temp }}/nsis-proof-${{ matrix.arch }}.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Linux native modules
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a pnpm --dir apps/desktop exec electron --no-sandbox scripts/native-modules-regression.mjs
      - name: Verify Linux preview isolation
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a pnpm --dir apps/desktop test:preview-security --no-sandbox
      - name: Verify Linux packaged startup
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a node apps/desktop/scripts/packaged-startup-regression.mjs "apps/desktop/dist-electron/${{ matrix.executable }}"
      # Final-distribution startup is separate from unpacked-app smoke. These
      # private unsigned artifacts never enter the public artifact uploader.
      - name: Build final macOS ZIP for native startup
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac zip --${{ matrix.arch }} -c.mac.identity=- --prepackaged "dist-electron/${{ matrix.securityTarget }}" --publish never
      - name: Verify final macOS ZIP native startup
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: node lawoss/testing/alpha/probe-startup-ci.mjs --output-dir "$RUNNER_TEMP/alpha-startup-${{ matrix.arch }}"
      - name: Install native Linux startup capture tools
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if ! command -v xwd >/dev/null || ! command -v xprop >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends x11-apps x11-utils
          fi
      - name: Verify final Linux AppImage native startup
        id: final_linux_startup
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: xvfb-run -a node lawoss/testing/alpha/probe-startup-ci.mjs --output-dir "$RUNNER_TEMP/alpha-startup-${{ matrix.arch }}"
      - name: Observe Linux sandbox prerequisites after failed native startup
        if: failure() && runner.os == 'Linux' && steps.final_linux_startup.outcome == 'failure'
        timeout-minutes: 3
        run: node lawoss/testing/alpha/diagnose-linux-sandbox-ci.mjs
      # Only the finite receipt and synthetic welcome window, after verified
      # cleanup. Profiles, raw receipts and final distributions remain private.
      - name: Upload synthetic final-artifact native startup evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-final-startup-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/alpha-startup-${{ matrix.arch }}/startup.json
            ${{ runner.temp }}/alpha-startup-${{ matrix.arch }}/startup.${{ runner.os == 'Linux' && 'xwd' || 'png' }}
          if-no-files-found: error
          retention-days: 7

  # A separate unmodified upstream rebuild can only diagnose the original RED.
  # Matrix aggregate failure also includes macOS: inspect Windows evidence first.
  windows-engine-baseline:
    name: Windows unmodified engine baseline (diagnostic only)
    needs: [package-smoke]
    # Frozen experiments40–44: retained as historical evidence, never automatically renewed.
    if: false
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MACOS_NOTARIZE: "false"
      LAWOSS_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Default checkout uses the SAME immutable run/merge SHA as package-smoke.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0; same Node 24 selector
        with:
          node-version: 24.21.0
      - name: Download only same-run Windows native projection
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: isir-native-diagnostics-windows-2022
          path: ${{ runner.temp }}/engine-baseline-input/native
      - name: Download only same-run Windows runtime projection
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: isir-engine-runtime-smoke-windows-2022
          path: ${{ runner.temp }}/engine-baseline-input/runtime
      - name: Guard original Windows boundary before heavy work
        id: baseline-guard
        run: node lawoss/testing/isir/native/engine-baseline-probe.mjs guard "${{ runner.temp }}/engine-baseline-provenance.json" "${{ runner.temp }}/engine-baseline-input/native/isir-native-diagnostics.json" "${{ runner.temp }}/engine-baseline-input/runtime/isir-engine-runtime-smoke.json"
      - name: Enable Windows long paths in this independent job
        if: steps.baseline-guard.outputs.run == 'true'
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.baseline-guard.outputs.run == 'true'
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.baseline-guard.outputs.run == 'true'
        with:
          bun-version: 1.4.2
      - name: Install ordinary LAWOSS dependencies in own checkout
        if: steps.baseline-guard.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build ordinary LAWOSS resources in own checkout
        if: steps.baseline-guard.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @legalwork/desktop build:electron
      - name: Rebuild unmodified pinned engine and run unchanged full native gate
        if: steps.baseline-guard.outputs.run == 'true'
        run: node lawoss/testing/isir/native/engine-baseline-probe.mjs run "${{ runner.temp }}/engine-baseline-provenance.json" "${{ runner.temp }}/engine-baseline-native.json"
      - name: Finalize bounded publication after success or failure
        id: baseline-finalize
        if: always()
        run: node lawoss/testing/isir/native/engine-baseline-probe.mjs finalize "${{ runner.temp }}/engine-baseline-provenance.json" "${{ runner.temp }}/engine-baseline-native.json"
      - name: Upload only allowlisted baseline provenance and native projection
        if: always() && steps.baseline-finalize.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: isir-engine-baseline-windows-2022
          path: |
            ${{ runner.temp }}/engine-baseline-provenance.json
            ${{ runner.temp }}/engine-baseline-native.json
          if-no-files-found: ignore
          retention-days: 7

  # Public-source monitor only: this never replaces the original baseline or
  # native startup gate. No executable or child-written artifact is published.
  windows-engine-compile-monitor:
    name: Windows public compile monitor (diagnostic only)
    needs: [windows-engine-baseline]
    # Frozen experiments40–44: retained as historical evidence, never automatically renewed.
    if: false
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      LAWOSS_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - name: Test closed compile monitor before any network or heavy work
        run: node --test lawoss/testing/isir/native/engine-compile-monitor.test.mjs
      - name: Download only same-run baseline provenance into private input
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: isir-engine-baseline-windows-2022
          path: ${{ runner.temp }}/compile-monitor-input
      - name: Guard exact same-head baseline build failure
        id: compile-monitor-guard
        run: node lawoss/testing/isir/native/engine-compile-monitor.mjs guard "${{ runner.temp }}/compile-monitor.private.json" "${{ runner.temp }}/compile-monitor-input/engine-baseline-provenance.json"
      - name: Observe one isolated public-source compilation
        if: steps.compile-monitor-guard.outputs.run == 'true'
        run: node lawoss/testing/isir/native/engine-compile-monitor.mjs run "${{ runner.temp }}/compile-monitor.private.json" "${{ runner.temp }}/compile-monitor-input/engine-baseline-provenance.json"
      - name: Publish only validated closed compile monitor metadata
        id: compile-monitor-finalize
        if: always()
        run: node lawoss/testing/isir/native/engine-compile-monitor.mjs finalize "${{ runner.temp }}/compile-monitor.private.json" "${{ runner.temp }}/engine-compile-monitor.json"
      - name: Upload only compile monitor projection
        if: always() && steps.compile-monitor-finalize.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: isir-engine-compile-monitor-windows-2022
          path: ${{ runner.temp }}/engine-compile-monitor.json
          if-no-files-found: error
          retention-days: 7

  # Fixed empty-auth behavioral experiment; original Windows RED is unchanged.
  windows-engine-empty-auth-probe:
    name: Windows original engine empty-auth behavior (diagnostic only)
    needs: [package-smoke]
    # Frozen experiments40–44: retained as historical evidence, never automatically renewed.
    if: false
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MACOS_NOTARIZE: "false"
      LAWOSS_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - name: Test closed empty-auth probe before artifact or heavy work
        run: node --test lawoss/testing/isir/native/engine-empty-auth-probe.test.mjs
      - name: Download only same-run original Windows native projection
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: isir-native-diagnostics-windows-2022
          path: ${{ runner.temp }}/empty-auth-input/native
      - name: Download only same-run original Windows runtime projection
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: isir-engine-runtime-smoke-windows-2022
          path: ${{ runner.temp }}/empty-auth-input/runtime
      - name: Guard first-attempt original Windows boundary before heavy work
        id: empty-auth-guard
        run: node lawoss/testing/isir/native/engine-empty-auth-probe.mjs guard "${{ runner.temp }}/empty-auth-owner.private.json" "${{ runner.temp }}/empty-auth-input/native/isir-native-diagnostics.json" "${{ runner.temp }}/empty-auth-input/runtime/isir-engine-runtime-smoke.json"
      - name: Enable Windows long paths in independent checkout
        if: steps.empty-auth-guard.outputs.run == 'true'
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.empty-auth-guard.outputs.run == 'true'
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.empty-auth-guard.outputs.run == 'true'
        with:
          bun-version: 1.4.2
      - name: Install ordinary LAWOSS dependencies once
        if: steps.empty-auth-guard.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build ordinary LAWOSS resources once
        if: steps.empty-auth-guard.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @legalwork/desktop build:electron
      - name: Run original pinned engine with fixed empty-auth producer
        if: steps.empty-auth-guard.outputs.run == 'true'
        run: node lawoss/testing/isir/native/engine-empty-auth-probe.mjs run "${{ runner.temp }}/empty-auth-owner.private.json"
      - name: Sole closed empty-auth publication after success or failure
        id: empty-auth-finalize
        if: always()
        run: node lawoss/testing/isir/native/engine-empty-auth-probe.mjs finalize "${{ runner.temp }}/empty-auth-owner.private.json" "${{ runner.temp }}/engine-empty-auth-probe.json"
      - name: Upload only the closed empty-auth projection
        if: always() && steps.empty-auth-finalize.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: isir-engine-empty-auth-probe-windows-2022
          path: ${{ runner.temp }}/engine-empty-auth-probe.json
          if-no-files-found: error
          retention-days: 7
