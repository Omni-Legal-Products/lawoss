name: Desktop Package Smoke Tests

on:
  # 🟡 LAWOSS: balenie a štart zabalenej appky (ISIR native, kontrola app.asar) beží na každom PR
  # a pushe do dev; „Package and launch“ sú povinné kontroly rulesetu dev. Upstream ho spúšťa len cez workflow_call.
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_call:
    inputs:
      runtime_provided:
        description: Volajúci workflow už pripravil artefakty sandbox-runtime-<platform>-<arch>
        type: boolean
        default: false
      windows-only:
        description: Limit this acceptance call to the two fixed native Windows hosts
        type: boolean
        default: false
      derivative-manifest-sha256:
        description: Optional independent digest of the engine artifact produced in this workflow run
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # 🟡 LAWOSS: pri samostatnom behu (PR, push) si balenie runtime izolovaného prostredia
  # postaví samo, len pre platformy z matice a bez sandbox testov (tie bežia v ci-tests).
  sandbox-runtime:
    if: ${{ !inputs.runtime_provided }}
    uses: ./.github/workflows/sandbox-runtime.yml
    with:
      targets: linux-x64,win32-x64,win32-arm64,darwin-arm64
      run_tests: false
  # 🟡 LAWOSS (ADR 0016, MČ 8. 11. 2026): pri samostatnom behu si engine 2.1.4-legalwork.http-policy.4
  # zostaví zo zdrojov vývojovou cestou (ad-hoc podpis); volajúci workflow môže dodať vlastný digest.
  opencode-engine:
    if: ${{ inputs.derivative-manifest-sha256 == '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-opencode-derivative.yml
    with:
      build-mode: development
  package-smoke:
    name: Package and launch (${{ matrix.os }})
    needs: [sandbox-runtime, opencode-engine]
    if: ${{ !cancelled() && (needs.sandbox-runtime.result == 'success' || needs.sandbox-runtime.result == 'skipped') && (needs.opencode-engine.result == 'success' || needs.opencode-engine.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.windows-only && '{"include":[{"os":"windows-2022","target":"x86_64-pc-windows-msvc","platform":"win","arch":"x64","executable":"win-unpacked/LAWOSS.exe","asar":"win-unpacked/resources/app.asar","securityTarget":"win-unpacked/LAWOSS.exe"},{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc","platform":"win","arch":"arm64","executable":"win-arm64-unpacked/LAWOSS.exe","asar":"win-arm64-unpacked/resources/app.asar","securityTarget":"win-arm64-unpacked/LAWOSS.exe"}]}' || '{"include":[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","platform":"linux","arch":"x64","executable":"linux-unpacked/legalwork","asar":"linux-unpacked/resources/app.asar","securityTarget":"linux-unpacked/legalwork"},{"os":"windows-2022","target":"x86_64-pc-windows-msvc","platform":"win","arch":"x64","executable":"win-unpacked/LAWOSS.exe","asar":"win-unpacked/resources/app.asar","securityTarget":"win-unpacked/LAWOSS.exe"},{"os":"macos-15","target":"aarch64-apple-darwin","platform":"mac","arch":"arm64","executable":"mac-arm64/LAWOSS.app/Contents/MacOS/LAWOSS","asar":"mac-arm64/LAWOSS.app/Contents/Resources/app.asar","securityTarget":"mac-arm64/LAWOSS.app"},{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc","platform":"win","arch":"arm64","executable":"win-arm64-unpacked/LAWOSS.exe","asar":"win-arm64-unpacked/resources/app.asar","securityTarget":"win-arm64-unpacked/LAWOSS.exe"}]}') }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MACOS_NOTARIZE: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: opencode-derivative-ci
          path: ${{ runner.temp }}/opencode-derivative
      # 🟡 LAWOSS: len vývojová (ad-hoc) príprava enginu.
      - uses: ./.github/actions/setup-opencode
        with:
          archive-directory: ${{ format('{0}/opencode-derivative/archives', runner.temp) }}
          manifest-sha256: ${{ inputs.derivative-manifest-sha256 || needs.opencode-engine.outputs.manifest-sha256 }}
          build-mode: development
      - name: Test config migration, token-file migration and link policy
        run: node --test apps/desktop/electron/opencode-config-migration.test.mjs apps/desktop/electron/runtime.test.mjs apps/desktop/electron/ui-control-server.test.mjs apps/desktop/electron/safe-open.test.mjs
      - uses: actions/download-artifact@v4
        with:
          # LAWOSS: matica má aj macOS (platform mac); runtime sa volá darwin-<arch>.
          name: sandbox-runtime-${{ matrix.platform == 'win' && 'win32' || matrix.platform == 'mac' && 'darwin' || matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/sandbox-runtime
      - name: Unpack protected runtime
        shell: bash
        run: |
          mkdir -p apps/server/resources/agent-sandbox/runtime
          archive="$RUNNER_TEMP/sandbox-runtime/sandbox-runtime.tgz"
          if [ "$RUNNER_OS" = Windows ]; then archive="$(cygpath -u "$archive")"; fi
          tar -xzf "$archive" -C apps/server/resources/agent-sandbox/runtime

      - name: Build desktop app and native dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEGALWORK_OPENCODE_ARCHIVES: ${{ format('{0}/opencode-derivative/archives', runner.temp) }}
        run: pnpm --filter @legalwork/desktop build:electron
      - name: Execute real engine, storage transitions, history, MCP and first-party tools
        id: engine-tests
        timeout-minutes: 10
        run: >-
          bun test --preload ./apps/server/test-preload.ts --preload ./apps/server/test-preload-lawoss.ts
          apps/server/src/managed-opencode.released.test.ts
          apps/server/src/engine-client.released.test.ts
          apps/server/src/managed-config.released.test.ts
          apps/server/src/managed-engine-lifecycle.released.test.ts
          apps/server/src/native-workspace-config.released.test.ts
          apps/server/src/native-config-state.test.ts
          apps/server/src/connectors/storage-transition.test.ts
          apps/server/src/agent-sandbox/project-approvals.test.ts
          apps/server/src/native-saved-approval-migration.test.ts
          apps/server/src/native-saved-approval-migration.released.test.ts
          apps/server/src/mcp-native-complete.released.test.ts
          apps/server/src/opencode-plugins/native-office-host.integration.test.ts
          apps/server/src/opencode-plugins/legalwork-raw-http.released.test.ts
      - name: Package desktop app
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }} ${{ runner.os == 'macOS' && '-c.mac.identity=-' || '' }} --dir --publish never
      # LAWOSS: importuje každý modul servera priamo zo zabaleného app.asar (Electron ako Node).
      - name: Verify packaged server modules load from app.asar
        run: node apps/desktop/scripts/check-packaged-server-imports.mjs "apps/desktop/dist-electron/${{ matrix.asar }}"
      - name: Verify Linux AppImage packaging
        if: runner.os == 'Linux'
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --linux AppImage --x64 --publish never
      - name: Verify shipped fuses, Node and document tools
        run: pnpm --dir apps/desktop check:packaged-security "dist-electron/${{ matrix.securityTarget || matrix.executable }}"
      - name: Run isolation probe with the packaged Node and VM
        run: |
          bun build scripts/sandbox/probe.ts --target=node --outfile=scripts/sandbox/probe.mjs
          node scripts/sandbox/probe-packaged.mjs "apps/desktop/dist-electron/${{ matrix.securityTarget }}"
      - name: Verify Windows and macOS native modules
        if: runner.os != 'Linux'
        timeout-minutes: 2
        run: pnpm --dir apps/desktop test:native
      - name: Verify Windows and macOS preview isolation
        if: runner.os != 'Linux'
        timeout-minutes: 2
        run: pnpm --dir apps/desktop test:preview-security
      - name: Verify Windows and macOS packaged startup
        if: runner.os != 'Linux'
        timeout-minutes: 3
        run: node apps/desktop/scripts/packaged-startup-regression.mjs "apps/desktop/dist-electron/${{ matrix.executable }}"
      - name: Verify Windows installer packaging
        if: runner.os == 'Windows'
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win --${{ matrix.arch }} --publish never
      # LAWOSS: nepodpísaný testovací inštalátor sa nenahráva ako artefakt behu; v public
      # repe by ho stiahol ktokoľvek prihlásený (rozhodnutie Q06/U6). Overí sa len jeho vznik.
      - name: Verify Windows test installer exists
        if: runner.os == 'Windows'
        run: ls apps/desktop/dist-electron/lawoss-win-${{ matrix.arch }}-*.exe
      - name: Verify Linux native modules
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a pnpm --dir apps/desktop exec electron --no-sandbox scripts/native-modules-regression.mjs
      - name: Verify Linux preview isolation
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a pnpm --dir apps/desktop test:preview-security --no-sandbox
      - name: Verify Linux packaged startup
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a node apps/desktop/scripts/packaged-startup-regression.mjs "apps/desktop/dist-electron/${{ matrix.executable }}"

  # LAWOSS (#384, MČ 8. 11. 2026): natívny test ISIR beží ako samostatný job mimo povinných
  # kontrol rulesetu. Zlyhanie je vidno v PR, ale neblokuje merge; balenie, štart a bezpečnostné
  # kontroly ostávajú povinné v „Package and launch“. Limity prípadov (240 s príprava, 90 s
  # inferencia) sa nemenia.
  isir-native:
    name: Native ISIR (${{ matrix.os }}, nepovinné)
    needs: sandbox-runtime
    if: ${{ !cancelled() && (needs.sandbox-runtime.result == 'success' || needs.sandbox-runtime.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            executable: linux-unpacked/legalwork
            asar: linux-unpacked/resources/app.asar
            securityTarget: linux-unpacked/legalwork
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win
            arch: x64
            executable: win-unpacked/LAWOSS.exe
            asar: win-unpacked/resources/app.asar
            securityTarget: win-unpacked/LAWOSS.exe
          - os: macos-15
            target: aarch64-apple-darwin
            platform: mac
            arch: arm64
            executable: mac-arm64/LAWOSS.app/Contents/MacOS/LAWOSS
            asar: mac-arm64/LAWOSS.app/Contents/Resources/app.asar
            securityTarget: mac-arm64/LAWOSS.app
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: win
            arch: arm64
            executable: win-arm64-unpacked/LAWOSS.exe
            asar: win-arm64-unpacked/resources/app.asar
            securityTarget: win-arm64-unpacked/LAWOSS.exe
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MACOS_NOTARIZE: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          # LAWOSS: matica má aj macOS (platform mac); runtime sa volá darwin-<arch>.
          name: sandbox-runtime-${{ matrix.platform == 'win' && 'win32' || matrix.platform == 'mac' && 'darwin' || matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/sandbox-runtime
      - name: Unpack protected runtime
        shell: bash
        run: |
          mkdir -p apps/server/resources/agent-sandbox/runtime
          archive="$RUNNER_TEMP/sandbox-runtime/sandbox-runtime.tgz"
          if [ "$RUNNER_OS" = Windows ]; then archive="$(cygpath -u "$archive")"; fi
          tar -xzf "$archive" -C apps/server/resources/agent-sandbox/runtime

      - name: Build desktop app and native dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @legalwork/desktop build:electron
      # Real isolated dev renderer + pinned sidecar + provider protocol fixture.
      # The packaged CDP prohibition stays covered by the existing security gate.
      - name: Enable synthetic-only native diagnostic artifact
        run: |
          echo "LAWOSS_ISIR_NATIVE_DIAGNOSTICS=1" >> "$GITHUB_ENV"
          echo "LAWOSS_ISIR_NATIVE_DIAGNOSTICS_FILE=$RUNNER_TEMP/isir-native-diagnostics.json" >> "$GITHUB_ENV"
      # Ten independent 240s provision + 90s inference windows can consume 55min.
      # Allow the complete batch plus fixtures, attachment and cold recovery;
      # every individual deadline and positive oracle stays in the harness.
      - name: Native ISIR renderer, tools and application relaunch (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 75
        run: xvfb-run -a pnpm test:isir:native
      - name: Native ISIR renderer, tools and application relaunch (Windows and macOS)
        id: native-isir-non-linux
        if: runner.os != 'Linux'
        timeout-minutes: 75
        run: pnpm test:isir:native
      - name: Probe bundled engine runtime after Windows native failure
        if: runner.os == 'Windows' && failure() && steps.native-isir-non-linux.outcome == 'failure'
        run: node lawoss/testing/isir/native/engine-runtime-smoke.mjs "${{ runner.temp }}/isir-engine-runtime-smoke.json"
      - name: Upload synthetic engine runtime metadata
        if: runner.os == 'Windows' && failure() && steps.native-isir-non-linux.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: isir-engine-runtime-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/isir-engine-runtime-smoke.json
          if-no-files-found: ignore
          retention-days: 7
      # Only the allowlisted projection is uploaded; never the private test root.
      - name: Upload synthetic native boundary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isir-native-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/isir-native-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7

  # LAWOSS: rozpočet RAM 2 GB (#367, ADR 0017). Samostatný job, aby bránu neblokoval
  # nestabilný natívny test ISIR v „Package and launch“ (pred ním sa appka ani nezabalila
  # a brána neprebehla). Zabalená appka, 10 syntetických klientov, balík SK základ
  # z pinovaného commitu LAWOSS Marketplace (lokálne zrkadlo, bez GitHub API limitu),
  # 4 otvorenia klienta; špička celého stromu procesov ≤ 2048 MB a po ukončení žiadne
  # siroty. Artefakt nesie len čísla (scripts/memory-budget/run.mjs).
  memory-budget:
    name: RAM budget 2 GB (macos-15)
    needs: [sandbox-runtime, opencode-engine]
    if: ${{ !cancelled() && (needs.sandbox-runtime.result == 'success' || needs.sandbox-runtime.result == 'skipped') && (needs.opencode-engine.result == 'success' || needs.opencode-engine.result == 'skipped') }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: aarch64-apple-darwin
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MACOS_NOTARIZE: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: opencode-derivative-ci
          path: ${{ runner.temp }}/opencode-derivative
      # 🟡 LAWOSS: len vývojová (ad-hoc) príprava enginu.
      - uses: ./.github/actions/setup-opencode
        with:
          archive-directory: ${{ format('{0}/opencode-derivative/archives', runner.temp) }}
          manifest-sha256: ${{ inputs.derivative-manifest-sha256 || needs.opencode-engine.outputs.manifest-sha256 }}
          build-mode: development
      - name: Test memory measurement helpers
        run: node --test scripts/memory-budget/memory.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-runtime-darwin-arm64
          path: ${{ runner.temp }}/sandbox-runtime
      - name: Unpack protected runtime
        run: |
          mkdir -p apps/server/resources/agent-sandbox/runtime
          tar -xzf "$RUNNER_TEMP/sandbox-runtime/sandbox-runtime.tgz" -C apps/server/resources/agent-sandbox/runtime
      - name: Build desktop app and native dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEGALWORK_OPENCODE_ARCHIVES: ${{ format('{0}/opencode-derivative/archives', runner.temp) }}
        run: pnpm --filter @legalwork/desktop build:electron
      - name: Package desktop app
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac --arm64 -c.mac.identity=- --dir --publish never
      - name: Cache synthetic dataset for the RAM budget
        uses: actions/cache@v4
        with:
          path: .work/synthetic-sk/dataset-v1.zip
          key: synthetic-sk-okf-v1-0edddcc3c22eb877
      - name: Verify RAM budget (2 GB) with the packaged app
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p .work/synthetic-sk
          zip=.work/synthetic-sk/dataset-v1.zip
          [ -f "$zip" ] || curl --fail --location --retry 3 "$(node -p 'require("./synthetic-dataset.json").download_url')" --output "$zip"
          echo "$(node -p 'require("./synthetic-dataset.json").sha256')  $zip" | shasum -a 256 -c -
          unzip -q -o "$zip" -d .work/synthetic-sk
          ref="$(node -p 'require("./apps/app/src/lawoss/domains/marketplace/marketplace-snapshot.json").ref')"
          git clone --quiet https://github.com/Omni-Legal-Products/lawoss-marketplace.git .work/lawoss-marketplace
          git -C .work/lawoss-marketplace cat-file -e "$ref^{commit}"
          node scripts/memory-budget/run.mjs --app apps/desktop/dist-electron/mac-arm64/LAWOSS.app/Contents/MacOS/LAWOSS \
            --dataset .work/synthetic-sk/LAWOSS-SK-synthetic-v1 --marketplace-repo .work/lawoss-marketplace \
            --clients 10 --open 4 --budget-mb 2048 --out "$RUNNER_TEMP/memory-budget"
      - name: Upload RAM budget measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-budget-macos-15
          path: ${{ runner.temp }}/memory-budget/memory-budget.json
          if-no-files-found: ignore
          retention-days: 14
