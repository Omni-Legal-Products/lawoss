name: ChatGPT subscription smoke (manual OAuth)

on:
  workflow_dispatch:
    inputs:
      model:
        description: Exact subscription model ID from the application allowlist (no fallback)
        type: string
        required: true
      recipient-public-key:
        description: Operator RSA public key, base64 DER SPKI; never a private key or token
        type: string
        required: true
      authorize:
        description: Authorize two short synthetic model prompts per platform using my ChatGPT plan
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: chatgpt-subscription-smoke
  cancel-in-progress: false

jobs:
  refused:
    if: github.ref != 'refs/heads/dev' || !inputs.authorize
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse untrusted ref or missing live-subscription consent
        run: exit 1

  preflight:
    if: github.ref == 'refs/heads/dev' && inputs.authorize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Validate consent, model, public recipient key and exact run identity
        env:
          CHATGPT_PROBE_CONSENT: ${{ inputs.authorize }}
          CHATGPT_PROBE_MODEL: ${{ inputs.model }}
          CHATGPT_PROBE_PUBLIC_KEY: ${{ inputs.recipient-public-key }}
          CHATGPT_PROBE_PLATFORM: macos-15
        run: node lawoss/testing/chatgpt/control.mjs preflight

  opencode-engine:
    needs: preflight
    uses: ./.github/workflows/ci-opencode-derivative.yml
    with:
      ref: ${{ github.sha }}
      build-mode: development

  subscription:
    name: ChatGPT OAuth (${{ matrix.os }})
    needs: [preflight, opencode-engine]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15, windows-2022, windows-11-arm]
    defaults:
      run:
        shell: bash
    env:
      CHATGPT_PROBE_CONSENT: ${{ inputs.authorize }}
      CHATGPT_PROBE_MODEL: ${{ inputs.model }}
      CHATGPT_PROBE_PUBLIC_KEY: ${{ inputs.recipient-public-key }}
      CHATGPT_PROBE_PLATFORM: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: opencode-derivative-ci
          path: ${{ runner.temp }}/opencode-derivative
      - uses: ./.github/actions/setup-opencode
        with:
          archive-directory: ${{ format('{0}/opencode-derivative/archives', runner.temp) }}
          manifest-sha256: ${{ needs.opencode-engine.outputs.manifest-sha256 }}
          build-mode: development
      - name: Source regressions without real login or model requests
        run: |
          set -euo pipefail
          node --test lawoss/testing/chatgpt/challenge.test.mjs
          bun test ./lawoss/testing/chatgpt/challenge.test.mjs
          pnpm --filter legalwork-server exec bun test src/chatgpt-subscription-probe.test.ts
          pnpm --filter legalwork-server exec tsc -p tsconfig.subscription-probe.json
      - name: Start isolated native OAuth worker
        env:
          LEGALWORK_OPENCODE_BIN: ${{ env.LEGALWORK_TEST_OPENCODE_BIN }}
        run: node lawoss/testing/chatgpt/control.mjs launch "$RUNNER_TEMP/chatgpt-subscription"
      - name: Publish encrypted device challenge for the operator
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-device-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chatgpt-subscription/public/challenge.json
          if-no-files-found: error
          retention-days: 1
      - name: Await manual device approval and verify response plus restart
        timeout-minutes: 15
        run: node lawoss/testing/chatgpt/control.mjs wait "$RUNNER_TEMP/chatgpt-subscription"
      - name: Stop the owned worker and erase credentials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/chatgpt-subscription/owner.json" ]; then
            node lawoss/testing/chatgpt/control.mjs stop "$RUNNER_TEMP/chatgpt-subscription"
          fi
      - name: Publish finite result only (never a profile, database, raw log or token)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-result-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chatgpt-subscription/public/report.json
          if-no-files-found: warn
          retention-days: 7
