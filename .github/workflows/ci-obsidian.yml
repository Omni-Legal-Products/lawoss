name: Obsidian OKF
on:
  pull_request:
    paths:
      - 'lawoss/obsidian-plugin/**'
      - 'lawoss/okf-reader/**'
      - 'lawoss/okf/**'
      - 'lawoss/okf-pamat/**'
      - 'apps/app/src/lawoss/okf/read-model.ts'
      - 'apps/app/src/lawoss/okf/view-rules.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-obsidian.yml'
  push:
    branches: [dev]
    paths: ['lawoss/obsidian-plugin/**', 'lawoss/okf-reader/**', 'lawoss/okf/**', 'lawoss/okf-pamat/**', 'pnpm-lock.yaml', '.github/workflows/ci-obsidian.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install reviewed closure
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @lawoss/obsidian-plugin --filter @lawoss/okf-reader --filter @lawoss/okf-pamat --filter @legalwork/app...
      - name: Typecheck reader
        run: pnpm --filter @lawoss/okf-reader typecheck
      - name: Typecheck plugin
        run: pnpm --filter @lawoss/obsidian-plugin typecheck
      - name: Typecheck app adapter
        run: pnpm --filter @legalwork/app typecheck
      - name: Lint plugin
        run: pnpm --filter @lawoss/obsidian-plugin lint
      - name: Portable behavior and app parity
        run: bun test lawoss/okf-reader/test/ lawoss/obsidian-plugin/test/ apps/app/tests/lawoss-okf-read.test.ts apps/app/tests/lawoss-okf-views-dynamic.test.tsx apps/app/tests/lawoss-cockpit.test.ts apps/app/tests/lawoss-practice-scope.test.ts
      - name: Memory regression suite
        run: pnpm --filter @lawoss/okf-pamat test
      - name: Build audited desktop plugin and browser core
        run: pnpm --filter @lawoss/obsidian-plugin build
      - name: Package manual pilot
        run: pnpm --filter @lawoss/obsidian-plugin package
      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-okf-${{ matrix.os }}
          path: |
            lawoss/obsidian-plugin/artifacts/
            lawoss/obsidian-plugin/dist/build-inputs.json
# Source tests/package builds are not native Obsidian acceptance or authorization to publish.
