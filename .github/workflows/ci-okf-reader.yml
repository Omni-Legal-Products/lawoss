name: Portable OKF reader
on:
  pull_request:
    paths: ['lawoss/okf-reader/**', 'lawoss/okf/**', 'lawoss/okf-pamat/**', 'apps/app/src/lawoss/okf/read-model.ts', 'apps/app/src/lawoss/okf/view-rules.ts', 'pnpm-lock.yaml', '.github/workflows/ci-okf-reader.yml']
  push:
    branches: [dev]
    paths: ['lawoss/okf-reader/**', 'lawoss/okf/**', 'lawoss/okf-pamat/**', 'apps/app/src/lawoss/okf/read-model.ts', 'apps/app/src/lawoss/okf/view-rules.ts', 'pnpm-lock.yaml', '.github/workflows/ci-okf-reader.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-reader:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @lawoss/okf-reader --filter @legalwork/app...
      - run: pnpm --filter @lawoss/okf-reader typecheck
      - run: pnpm --filter @legalwork/app typecheck
      - run: bun test lawoss/okf-reader/test/ apps/app/tests/lawoss-okf-read.test.ts apps/app/tests/lawoss-okf-views-dynamic.test.tsx apps/app/tests/lawoss-cockpit.test.ts apps/app/tests/lawoss-practice-scope.test.ts
      - run: bun build lawoss/okf-reader/src/index.ts --target browser --outfile .work/okf-reader-browser.js
