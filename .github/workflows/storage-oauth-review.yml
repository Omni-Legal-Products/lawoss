name: Storage OAuth review builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, macos-15, windows-2022, ubuntu-24.04]

permissions:
  contents: read

concurrency:
  group: storage-review-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  selected-instance:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.platform == 'windows-2022' &&
      github.run_attempt == 1 &&
      github.ref_type == 'branch' &&
      startsWith(github.ref, 'refs/heads/chore/windows-app-start-repro-')
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        id: diagnostic-pnpm
        with:
          version: 11.4.0
          run_install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Capture exact tools for genuine server-only build
        env:
          LAWOSS_PNPM_DEST: ${{ steps.diagnostic-pnpm.outputs.dest }}
        run: |
          $diagnosticNode = (Get-Command node -CommandType Application -TotalCount 1 -ErrorAction Stop).Source
          $diagnosticBun = (Get-Command bun -CommandType Application -TotalCount 1 -ErrorAction Stop).Source
          if ((& $diagnosticNode --version) -ne 'v24.21.0') { throw 'NODE_VERSION' }
          if ((& $diagnosticBun --version) -ne '1.4.2') { throw 'BUN_VERSION' }
          "LAWOSS_NODE_EXE=$diagnosticNode" >> $env:GITHUB_ENV
          "LAWOSS_BUN_EXE=$diagnosticBun" >> $env:GITHUB_ENV
          "LAWOSS_PNPM_DEST=$env:LAWOSS_PNPM_DEST" >> $env:GITHUB_ENV
      - name: Pure and fake diagnostic seams
        run: |
          & $env:LAWOSS_NODE_EXE --test --test-reporter=tap lawoss/testing/engine-diagnostics/windows-app-start-repro.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DIAGNOSTIC_TESTS' }
      - name: Frozen genuine dependencies, Electron installation and server build
        env:
          LAWOSS_REPRO_PLATFORM: ${{ inputs.platform }}
        run: |
          & $env:LAWOSS_NODE_EXE lawoss/testing/engine-diagnostics/windows-app-start-repro.mjs --build-ci
          if ($LASTEXITCODE -ne 0) { throw 'BUILD_PREREQUISITE' }
      - name: Coupled headless app-start diagnostic
        env:
          LAWOSS_REPRO_PLATFORM: ${{ inputs.platform }}
        run: |
          & $env:LAWOSS_NODE_EXE lawoss/testing/engine-diagnostics/windows-app-start-repro.mjs --run-ci
          if ($LASTEXITCODE -ne 0) { throw 'APP_START_DIAGNOSTIC' }
      - name: Validate finalized synthetic receipt
        id: receipt
        if: always()
        run: |
          if (Test-Path -LiteralPath windows-app-start-receipt.json) {
            & $env:LAWOSS_NODE_EXE lawoss/testing/engine-diagnostics/windows-app-start-repro.mjs --validate-receipt
            if ($LASTEXITCODE -ne 0) { throw 'RECEIPT_REFUSED' }
            'present=true' >> $env:GITHUB_OUTPUT
          }
      - name: Save only validated synthetic receipt
        if: always() && steps.receipt.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-app-start-${{ github.sha }}
          path: windows-app-start-receipt.json
          if-no-files-found: error
          retention-days: 7
