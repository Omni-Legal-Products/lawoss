name: Storage OAuth review builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, macos-15, windows-2022, ubuntu-24.04]

permissions:
  contents: read

concurrency:
  group: storage-review-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  selected-instance:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.platform == 'windows-2022' &&
      github.run_attempt == 1 &&
      github.ref_type == 'branch' &&
      startsWith(github.ref, 'refs/heads/chore/windows-instance-repro-')
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - name: Pure and fake production-seam tests
        run: node --test --test-reporter=tap lawoss/testing/engine-diagnostics/windows-instance-repro.test.mjs
      - name: Original Windows selected-instance diagnostic
        env:
          LAWOSS_REPRO_PLATFORM: ${{ inputs.platform }}
        run: node lawoss/testing/engine-diagnostics/windows-instance-repro.mjs --run-ci
      - name: Validate finalized synthetic receipt
        id: receipt
        if: always()
        run: |
          if (Test-Path -LiteralPath windows-instance-receipt.json) {
            node lawoss/testing/engine-diagnostics/windows-instance-repro.mjs --validate-receipt
            if ($LASTEXITCODE -ne 0) { throw 'RECEIPT_REFUSED' }
            'present=true' >> $env:GITHUB_OUTPUT
          }
      - name: Save only validated synthetic receipt
        if: always() && steps.receipt.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-selected-instance-${{ github.sha }}
          path: windows-instance-receipt.json
          if-no-files-found: error
          retention-days: 7
