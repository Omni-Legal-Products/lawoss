name: OKF pamäť

on:
  pull_request:
    # Test aj pri nadväzujúcom PR do integračnej vetvy, nie až pri merge do dev.
    paths: ["lawoss/okf-pamat/**", "lawoss/okf-handoff/**", "lawoss/tests/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/ci-okf-pamat.yml"]
  push:
    branches: [dev]
    paths: ["lawoss/okf-pamat/**", "lawoss/okf-handoff/**", "lawoss/tests/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/ci-okf-pamat.yml"]

permissions:
  contents: read

jobs:
  okf-pamat:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    defaults:
      run:
        working-directory: lawoss/okf-pamat

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # OKF patrí do pnpm workspace; používame koreňový lockfile.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @lawoss/okf-pamat

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Natívny handoff
        working-directory: .
        run: bun test lawoss/okf-handoff/

      - name: Bundle je čerstvý
        # `bundle/okf-memory.js` sa inštaluje do workspace-u ako CLI skillu
        # `/okf-pamat`, takže zastaraný bundle znamená, že agent v appke beží
        # na inom kóde než repozitár.
        run: |
          bun run build
          git diff --exit-code bundle/
