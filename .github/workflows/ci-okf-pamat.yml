name: OKF pamäť

on:
  pull_request:
    branches: [dev]
    paths: ["lawoss/okf-pamat/**", ".github/workflows/ci-okf-pamat.yml"]
  push:
    branches: [dev]
    paths: ["lawoss/okf-pamat/**", ".github/workflows/ci-okf-pamat.yml"]

permissions:
  contents: read

jobs:
  okf-pamat:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    defaults:
      run:
        working-directory: lawoss/okf-pamat

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      # Balíček je členom pnpm workspace (`lawoss/*` v pnpm-workspace.yaml) —
      # inštaluje sa z koreňového lockfile, iba jeho vlastné závislosti.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @lawoss/okf-pamat

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
