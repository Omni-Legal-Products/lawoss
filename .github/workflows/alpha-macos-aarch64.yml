name: Alpha Channel (macOS arm64)

# Dispatch this workflow manually (Actions tab) to publish a fresh macOS arm64
# build to the LAWOSS alpha release channel.
#
# The alpha channel is macOS-only today. It lives as a rolling GitHub
# release. Each run also updates a small manifest on the fixed
# `alpha-macos-latest` release so the Electron updater feed stays stable while
# historical alpha artifacts remain available.
#
# 🟡 LAWOSS: podpis ako vo Windows workflowe (rozhodnutie tímu Q06/U6, verejné
# binárky len podpísané). Bez notarizácie (vars.MACOS_NOTARIZE nastavená inak
# než 'true'; nenastavená znamená notarizáciu) beh hneď na začiatku (job `signing`)
# skončí, pokiaľ spúšťajúci výslovne nezvolí `allow_unsigned_internal`. Taký ad-hoc
# podpísaný build je len pre interný tím: vyjde vždy ako koncept (draft) s názvom
# „NEPODPÍSANÉ – len interný tím“, nikdy neposunie verejný `alpha-macos-latest`
# a neuloží sa ako artefakt behu. Notarizácia bez Apple certifikátu a notárskeho
# kľúča (secrets) skončí tiež hneď.
#
# See:
#   - ARCHITECTURE.md#release-channels
#   - .github/workflows/release-macos-aarch64.yml (stable channel)
#   - .github/workflows/alpha-windows-x64.yml (LAWOSS: rovnaká brána podpisu)

on:
  # Manual-only: dispatch from the GitHub Actions tab to publish a macOS arm64
  # alpha build to the rolling alpha-macos-latest release. Builds are unsigned
  # until Apple signing secrets are added + MACOS_NOTARIZE=true (see the
  # signed/unsigned package steps below).
  # 🟡 LAWOSS: nepodpísaný build len so vstupom `allow_unsigned_internal` a len ako
  # koncept; inak beh skončí v jobe `signing` (viď hlavičku).
  workflow_dispatch:
    inputs:
      sandbox_tests:
        description: Run sandbox validation tests (adds build time)
        type: boolean
        default: false
      base_version:
        description: "LAWOSS: alpha base X.Y.Z, e.g. 0.2.1 (overrides vars.LAWOSS_ALPHA_BASE_VERSION; empty = next patch after the latest v* tag)"
        required: false
        type: string
      draft:
        description: "LAWOSS: koncept (draft) vydanie bez aktualizácie ukazovateľa alfa kanála; testeri ho nedostanú automaticky"
        required: false
        type: boolean
        default: false
      allow_unsigned_internal:
        description: "LAWOSS: ak vars.MACOS_NOTARIZE nie je 'true' (bez notarizácie), povoliť NEPODPÍSANÝ (ad-hoc) build len pre interný tím: vždy len koncept (draft) bez posunu ukazovateľa, Gatekeeper varuje, žiadne klientske údaje. Verejné binárky len podpísané."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alpha-macos-aarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🟡 LAWOSS: rozhodnutie Q06/U6, rovnako ako job `signing` v alpha-windows-x64.yml.
  # Samostatný job pred sandbox runtime a buildom, aby beh bez notarizácie skončil
  # skôr, než sa stavia. Výstupy `signed` a `draft` čítajú kroky buildu aj releasu
  # (aj pri opakovaní neúspešných jobov); nepodpísaný build je vždy koncept.
  signing:
    name: Require notarization or an explicit unsigned internal build
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      draft: ${{ steps.signing.outputs.draft }}
    steps:
      - name: Require notarization or an explicit unsigned internal build
        id: signing
        shell: bash
        env:
          # Rovnaké vyhodnotenie ako doterajšie `env.MACOS_NOTARIZE == 'true'` v krokoch balenia.
          NOTARIZE: ${{ (vars.MACOS_NOTARIZE || 'true') == 'true' }}
          # Notarizácia bez týchto secrets by zlyhala až po zostavení (electron-after-sign.cjs).
          HAS_APPLE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 != '' && secrets.APPLE_NOTARY_API_KEY_ID != '' && secrets.APPLE_NOTARY_API_ISSUER_ID != '' && secrets.APPLE_NOTARY_API_KEY_P8_BASE64 != '' }}
          ALLOW_UNSIGNED_INTERNAL: ${{ inputs.allow_unsigned_internal }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          if [ "${NOTARIZE:-false}" = "true" ]; then
            if [ "${HAS_APPLE:-false}" != "true" ]; then
              echo "::error title=Chýbajú Apple secrets::MACOS_NOTARIZE je 'true' alebo nie je nastavené, ale chýba niektorý zo secrets APPLE_CODESIGN_CERT_P12_BASE64, APPLE_NOTARY_API_KEY_ID, APPLE_NOTARY_API_ISSUER_ID, APPLE_NOTARY_API_KEY_P8_BASE64. Podpis a notarizácia by zlyhali až po zostavení. Doplňte secrets, alebo nastavte vars.MACOS_NOTARIZE na 'false' a nepodpísaný build pre interný tím spustite s allow_unsigned_internal=true."
              exit 1
            fi
            echo "MACOS_NOTARIZE je 'true'; build sa podpíše a notarizuje."
            echo "signed=true" >> "$GITHUB_OUTPUT"
            if [ "${DRAFT:-false}" = "true" ]; then
              echo "draft=true" >> "$GITHUB_OUTPUT"
            else
              echo "draft=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "${ALLOW_UNSIGNED_INTERNAL:-false}" != "true" ]; then
            echo "::error title=Notarizácia nie je zapnutá::MACOS_NOTARIZE nie je 'true', build by bol len ad-hoc podpísaný a nenotarizovaný. Verejné binárky LAWOSS musia byť podpísané (rozhodnutie Q06/U6). Nepodpísaný build len pre interný tím spustite so vstupom allow_unsigned_internal=true; release dostane varovanie v názve aj v popise."
            exit 1
          fi
          echo "::warning title=NEPODPÍSANÝ build::Bez notarizácie (ad-hoc podpis), povolené cez allow_unsigned_internal. Len pre interný tím: vyjde len ako koncept (draft), ukazovateľ alpha-macos-latest sa neposunie, Gatekeeper varuje, žiadne klientske údaje."
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "draft=true" >> "$GITHUB_OUTPUT"

  sandbox-runtime:
    needs: signing
    uses: ./.github/workflows/sandbox-runtime.yml
    with:
      targets: darwin-arm64
      run_tests: ${{ inputs.sandbox_tests }}
  publish-alpha-macos-aarch64:
    needs: [signing, sandbox-runtime]
    name: Build + Publish alpha (aarch64-apple-darwin)
    runs-on: macos-14
    timeout-minutes: 180

    env:
      ALPHA_RELEASE_TAG: alpha-macos-latest
      ALPHA_RELEASE_NAME: LAWOSS Alpha (macOS arm64)
      # Apple signing + notarization are required so alpha bundles install
      # and launch without Gatekeeper friction. Alpha builds are served
      # from GitHub Releases like stable, just from a different tag.
      # 🟡 LAWOSS: hodnotu určuje brána `signing` (vars.MACOS_NOTARIZE || 'true'),
      # aby balenie, názov releasu aj ukazovateľ vychádzali z toho istého rozhodnutia.
      MACOS_NOTARIZE: ${{ needs.signing.outputs.signed }}
      SIGNED: ${{ needs.signing.outputs.signed }}
      DRAFT: ${{ needs.signing.outputs.draft }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          # Full history so `git describe` can find the latest v* release tag —
          # alpha versions are derived from it (package.json is a placeholder).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.21.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: "1.4.2"

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: macos-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            macos-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Resolve alpha version
        id: alpha-version
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          # LAWOSS: fork tags stop at v0.1.14 while dev already carries upstream
          # 0.2.x, so an explicit base keeps alpha versions in step with the code.
          ALPHA_BASE_VERSION: ${{ inputs.base_version || vars.LAWOSS_ALPHA_BASE_VERSION }}
        run: |
          set -euo pipefail
          # The latest v* tag reachable from this commit is the version source
          # of truth (package.json only carries a 0.0.0 placeholder). Alpha
          # builds advertise the *next* patch version so semver comparison
          # makes the alpha newer than the current stable (e.g. stable
          # 0.11.207 < alpha 0.11.208-alpha.<run>). Once stable 0.11.208
          # ships, its semver beats the alpha prerelease tag and alpha users
          # cleanly migrate forward.
          latest_tag="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v0.0.0)"
          base="${latest_tag#v}"
          base="${base%%[-+]*}"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $latest_tag" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$base"
          next_patch=$((patch + 1))
          alpha_base="${major}.${minor}.${next_patch}"
          explicit_base="${ALPHA_BASE_VERSION:-}"
          explicit_base="${explicit_base#v}"
          if [ -n "$explicit_base" ]; then
            if [[ ! "$explicit_base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid alpha base version: $explicit_base (expected X.Y.Z)" >&2
              exit 1
            fi
            IFS=. read -r emajor eminor epatch <<<"$explicit_base"
            if (( emajor < major || (emajor == major && (eminor < minor || (eminor == minor && epatch < next_patch))) )); then
              echo "Alpha base $explicit_base is lower than $alpha_base derived from $latest_tag; remove LAWOSS_ALPHA_BASE_VERSION or raise it." >&2
              exit 1
            fi
            alpha_base="$explicit_base"
          fi
          run="${GITHUB_RUN_NUMBER:-0}"
          sha="${GITHUB_SHA:0:7}"
          sha="${sha:-local}"
          echo "Latest release tag: $latest_tag -> alpha base ${alpha_base}"
          # The commit sha rides in the prerelease part (…-alpha.<run>.g<sha>),
          # not as +<sha> build metadata: pnpm refuses to workspace-link the
          # exact-pinned internal deps (legalwork-server, opencode-router) when
          # the stamped version carries build metadata, and falls back to the
          # public npm registry (404 / name-squatted package). The "g" prefix
          # (git describe's convention) keeps the identifier valid semver: a
          # sha made of digits only with a leading zero, such as 0904434, is
          # not a legal numeric prerelease identifier, and pnpm then cannot
          # match the workspace package either and falls back the same way.
          {
            echo "alpha_version=${alpha_base}-alpha.${run}.g${sha}"
            echo "base_version=${alpha_base}"
            echo "release_tag=alpha-macos-v${alpha_base}-alpha.${run}-${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp alpha version
        shell: bash
        env:
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
        # Lockfile-only resync keeps pnpm-lock.yaml consistent with the stamped
        # orchestrator dependency pins so later pnpm invocations don't reject
        # the workspace (installs stay explicit + frozen before this step).
        run: |
          node scripts/release/build-info.mjs --assert-clean
          node scripts/release/apply-version.mjs --version "$ALPHA_VERSION"
          pnpm install --lockfile-only --no-frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-runtime-darwin-arm64
          path: ${{ runner.temp }}/sandbox-runtime
      - name: Unpack protected runtime
        shell: bash
        run: |
          mkdir -p apps/server/resources/agent-sandbox/runtime
          tar -xzf "$RUNNER_TEMP/sandbox-runtime/sandbox-runtime.tgz" -C apps/server/resources/agent-sandbox/runtime

      - name: Write notary API key
        if: env.MACOS_NOTARIZE == 'true'
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"

          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build Electron alpha app
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
          # The renderer bundle (vite build) peaks above Node's default heap
          # since the editors and media viewers joined it; the 7 GB runner has
          # room for this.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @legalwork/desktop build:electron

      - name: Package Electron alpha (macOS, signed + notarized)
        if: env.MACOS_NOTARIZE == 'true'
        env:
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            --mac \
            --arm64 \
            --publish never

      - name: Package Electron alpha (macOS, ad-hoc signed)
        if: env.MACOS_NOTARIZE != 'true'
        env:
          # No Apple cert/notary secrets -> ad-hoc sign (mac.identity=-) so
          # Gatekeeper shows "developer cannot be verified -> Open Anyway"
          # instead of "damaged". disable-library-validation is already set in
          # build/entitlements.mac.plist, so the hardened runtime can stay on.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          echo "MACOS_NOTARIZE != 'true' -> ad-hoc signing macOS arm64 alpha."
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            -c.mac.identity=- \
            --mac \
            --arm64 \
            --publish never

      - name: Verify packaged startup
        timeout-minutes: 3
        run: node apps/desktop/scripts/packaged-startup-regression.mjs "apps/desktop/dist-electron/mac-arm64/LAWOSS.app/Contents/MacOS/LAWOSS"

      - name: Record final target evidence after signing and startup
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/release/checksums.mjs apps/desktop/dist-electron
          node scripts/release/release-evidence.mjs create --build apps/desktop/resources/build-info.json --assets-dir apps/desktop/dist-electron --release-tag "$RELEASE_TAG"

      # 🟡 LAWOSS: artefakt behu je v public repe verejný, preto len podpísaný build
      # (ako vo Windows workflowe); nepodpísaný ostáva len v koncepte releasu.
      - name: Stage exact final artifact for native acceptance
        if: env.SIGNED == 'true'
        shell: bash
        run: node scripts/release/acceptance-handoff.mjs stage --assets-dir apps/desktop/dist-electron --out "$RUNNER_TEMP/release-candidate"

      - name: Preserve final installer and target evidence before the public gate
        if: env.SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}-darwin-arm64
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Require exact native acceptance before public publication
        if: ${{ needs.signing.outputs.draft != 'true' }}
        run: node scripts/release/release-evidence.mjs verify --evidence apps/desktop/dist-electron/release-evidence-darwin-arm64.json --assets-dir apps/desktop/dist-electron --require-tested

      - name: Create immutable alpha prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_VERSION: ${{ steps.alpha-version.outputs.alpha_version }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          # 🟡 LAWOSS: názov a popis podľa podpisu (Q06/U6) ako vo Windows workflowe;
          # nepodpísaný build je vždy koncept (draft), viditeľný len tímu s právom zápisu.
          unsigned_prefix="NEPODPÍSANÉ – len interný tím · "
          title="LAWOSS Alpha ${ALPHA_VERSION} (macOS arm64)"
          notes="$RUNNER_TEMP/alpha-release-notes.md"
          {
            if [ "$SIGNED" != "true" ]; then
              title="${unsigned_prefix}${title}"
              cat <<'EOF'
          > [!WARNING]
          > **NEPODPÍSANÝ build – len pre interný tím LAWOSS.**
          >
          > - Aplikácia je podpísaná len ad-hoc a nie je notarizovaná. macOS Gatekeeper ju pri prvom spustení zablokuje; otvoríte ju cez **Systémové nastavenia → Súkromie a bezpečnosť → Otvoriť aj tak**.
          > - Určené výhradne interným testerom. Ďalej ho nešírte.
          > - Žiadne klientske ani iné dôverné údaje, len vymyslené alebo verejné.

          EOF
            fi
            echo "Priebežná alfa LAWOSS ${ALPHA_VERSION} (macOS arm64) z commitu ${GITHUB_SHA}."
            # Len nepodpísaný koncept: podpísaný koncept sa neskôr zverejní bez prepisu poznámok.
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "Koncept (draft): vidia ho len členovia s právom zápisu do repa. Updater ho neponúka, \`alpha-macos-latest\` sa neposunul."
            fi
          } > "$notes"
          if gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Opakovaný beh (Re-run all jobs) číta podpis znova, ako vo Windows workflowe.
            # Keď sa stav konceptu alebo podpisu (predpona názvu) nezhoduje s prvým
            # pokusom, nič sa nenahrá ani nepremenuje: názov a popis musia sedieť s assetmi
            # prvého pokusu. Inak sa zosúladia s týmto pokusom.
            existing_draft="$(gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$existing_draft" != "$DRAFT" ]; then
              echo "::error title=Opakovaný beh s iným podpisom::Release $ALPHA_RUN_RELEASE_TAG má draft=$existing_draft, tento pokus draft=$DRAFT (signed=$SIGNED). Assety ani ukazovateľ sa nemenia. Spustite workflow znova ako nový beh (nová verzia a tag), prípadne release najprv odstráňte."
              exit 1
            fi
            existing_name="$(gh release view "$ALPHA_RUN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name)"
            existing_signed=true
            case "$existing_name" in "${unsigned_prefix}"*) existing_signed=false ;; esac
            if [ "$existing_signed" != "$SIGNED" ]; then
              echo "::error title=Opakovaný beh s iným podpisom::Release $ALPHA_RUN_RELEASE_TAG je signed=$existing_signed (podľa názvu), tento pokus signed=$SIGNED. Názov, popis ani assety sa nemenia. Spustite workflow znova ako nový beh (nová verzia a tag), prípadne release najprv odstráňte."
              exit 1
            fi
            echo "Alpha prerelease $ALPHA_RUN_RELEASE_TAG already exists; reusing it."
            gh release edit "$ALPHA_RUN_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$notes"
            exit 0
          fi
          release_flags=(--prerelease)
          if [ "$DRAFT" = "true" ]; then
            release_flags+=(--draft)
          fi
          gh release create "$ALPHA_RUN_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file "$notes" \
            --target "$GITHUB_SHA" \
            "${release_flags[@]}"

      - name: Upload Electron alpha updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/release/publish-electron-assets.mjs --payload-only ${{ needs.signing.outputs.draft == 'true' && '--draft-payload' || '' }} apps/desktop/dist-electron "$ALPHA_RUN_RELEASE_TAG"

      - name: Update alpha updater pointer
        # LAWOSS: koncept nemení ukazovateľ alfa kanála; nepodpísaný build je vždy
        # koncept (Q06/U6), takže tento workflow ukazovateľ na nepodpísaný neposunie.
        if: ${{ needs.signing.outputs.draft != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RUN_RELEASE_TAG: ${{ steps.alpha-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" != "true" ]; then
            echo "::error title=Ukazovateľ sa neposúva::signed=$SIGNED. Verejný alpha-macos-latest smie mieriť len na podpísaný a notarizovaný zverejnený release."
            exit 1
          fi
          node scripts/release/channel-evidence.mjs --evidence apps/desktop/dist-electron/release-evidence-darwin-arm64.json --pointer-tag "$ALPHA_RELEASE_TAG" --manifest latest-mac.yml
          POINTER_MANIFEST="$RUNNER_TEMP/latest-mac.yml"
          export POINTER_MANIFEST
          node <<'NODE'
          const fs = require("node:fs");
          const manifestPath = "apps/desktop/dist-electron/latest-mac.yml";
          const releaseTag = process.env.ALPHA_RUN_RELEASE_TAG;
          // LAWOSS: the pointer must reference the repository the assets were
          // just uploaded to, and the lawoss- artifactName from electron-builder.yml.
          const baseUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/releases/download/${releaseTag}`;
          const rewritten = fs.readFileSync(manifestPath, "utf8")
            .replace(/(url:\s*)(lawoss-[^\n]+)/g, `$1${baseUrl}/$2`)
            .replace(/(path:\s*)(lawoss-[^\n]+)/g, `$1${baseUrl}/$2`);
          fs.writeFileSync(process.env.POINTER_MANIFEST, rewritten);
          NODE

          if ! gh release view "$ALPHA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$ALPHA_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ALPHA_RELEASE_NAME" \
              --notes "Stable Electron updater pointer for the newest macOS arm64 alpha prerelease." \
              --target "$GITHUB_SHA" \
              --prerelease
          fi

          gh release upload "$ALPHA_RELEASE_TAG" "$POINTER_MANIFEST#latest-mac.yml" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
