# Testy Fázy A (`okf` CLI a šablóny). Vlastný workflow, lebo `ci-okf-pamat.yml`
# sa spúšťa len na `lawoss/okf-pamat/**` a `pnpm --filter @legalwork/app test`
# vidí iba `apps/app/tests/` — `lawoss/okf/test/` tak doteraz v CI nebežal
# vôbec. Test, ktorý nikde nebeží, nie je test.
name: OKF CLI

on:
  pull_request:
    branches: [dev]
    paths: ["lawoss/okf/**", ".github/workflows/ci-okf.yml"]
  push:
    branches: [dev]
    paths: ["lawoss/okf/**", ".github/workflows/ci-okf.yml"]

permissions:
  contents: read

jobs:
  okf:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    defaults:
      run:
        working-directory: lawoss/okf

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Balíček má nulové závislosti — inštalácia by nemala čo robiť.
      - name: Test
        run: bun test test/
