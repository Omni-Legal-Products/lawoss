name: DOCX interoperability
on:
  pull_request:
    branches: [dev]
    paths:
      - 'apps/app/src/react-app/domains/session/artifacts/**'
      - 'apps/app/tests/docx-*.test.ts'
      - 'apps/app/scripts/docx-*'
      - 'apps/app/scripts/fixtures/**'
      - 'patches/@eigenpal*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-docx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      # The suite loads docx-export.ts, which imports the app's "@/" alias.
      # Bun resolves it the way every other test suite here does; plain node
      # does not.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @legalwork/app exec bun test tests/docx-document-state.test.ts tests/docx-roundtrip.test.ts
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils fonts-liberation
      - run: pnpm --filter @legalwork/app exec node scripts/docx-interop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docx-interop-evidence
          path: apps/app/docx-interop-output/
