# appId / productName define LAWOSS's macOS bundle identity (keychain,
# Launchpad slot, TCC permissions). Keep in sync with the runtime identifiers
# in apps/desktop/electron/main.mjs.
appId: com.eigenweltlabs.legalwork
productName: LAWOSS
# Bez tohto riadku si electron-builder odvodí copyright z `author` v
# package.json (default `Copyright © <rok> <author>`) a do binárky by sa
# dostal jediný držiteľ. LAWOSS je fork: drvivá väčšina kódu je LegalWork pod
# MIT, ktorá žiada zachovať pôvodnú doložku. Preto sú tu menovaní obaja.
copyright: "Copyright © 2026 LAWOSS contributors. Based on LegalWork, Copyright © 2026 Eigenwelt Labs. MIT License."
protocols:
  - name: LAWOSS
    schemes:
      - legalwork
directories:
  output: dist-electron
files:
  - electron/**/*
  - server/**/*
  - "!server/dist/opencode-plugins/**"
  - package.json
extraResources:
  # MIT žiada doložku „in all copies or substantial portions of the Software".
  # Balík je kópia: bez týchto dvoch súborov by tester dostal .dmg, v ktorom
  # licencia LegalWorku nie je nikde. `files:` je whitelist a koreň repozitára
  # do neho nesiaha, preto idú cez extraResources.
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: resources/node
    to: node
    filter:
      - node
      - node.exe
      - LICENSE
      - runtime.json
  - from: ../server/resources/ocr
    to: ocr
  # LAWOSS: pribalený katalóg modelov. Engine je samostatný proces a do app.asar
  # nevidí, preto leží vedľa neho (apps/server/src/lawoss/engine-network.ts).
  - from: ../../lawoss/models-catalog
    to: lawoss-models
    filter:
      - api.json
  - from: ../app/dist
    to: app-dist
  - from: ../app/dist-word-addin
    to: word-addin-dist
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
      - "!*.test.js"
  # The runtime dock/window icon, which the .icns baked in below cannot supply:
  # resolveAppIconPath() reads these out of `process.resourcesPath/icons` so the
  # dock can swap to the ink plate when macOS is in dark mode. Without them a
  # packaged build finds no icon at all (`files:` does not pack resources/), so
  # app.dock.setIcon() is never called and the icon never follows the system.
  - from: resources/icons
    to: icons
    filter:
      - icon.png
      - icon-dark.png
asar: true
# Workspace tools use the bundled Node runtime rather than relaunching Electron.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
asarUnpack:
  - node_modules/.pnpm/@napi-rs+canvas*/**
  - node_modules/@napi-rs/canvas*/**
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
  # sherpa-onnx ships prebuilt native libraries (local speech-to-text for the
  # Recorder tab); the addon dlopens sibling dylibs/DLLs so it must live
  # outside the asar.
  - node_modules/.pnpm/sherpa-onnx*/**
  - node_modules/sherpa-onnx-node/**
  # The bundled Node OCR worker must resolve JS and native files outside ASAR.
  - node_modules/.pnpm/onnxruntime*/**
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - node_modules/.pnpm/paddleocr*/**
  - node_modules/paddleocr/**
  - node_modules/.pnpm/image-size*/**
  - node_modules/image-size/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
# Fallback electron-updater feed target (LAWOSS GitHub releases) and
# channel-manifest generation. At runtime updater.mjs points stable updates at
# https://lawoss.app/update via setFeedURL.
publish:
  - provider: github
    owner: Omni-Legal-Products
    repo: lawoss
    releaseType: release
mac:
  binaries:
    - Contents/Resources/node/node
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: LAWOSS uses the microphone when you start Voice Mode or record a conversation in the Recorder tab.
    NSAudioCaptureUsageDescription: LAWOSS captures system audio when you record calls or meetings in the Recorder tab. Audio is transcribed locally on this device and never uploaded.
    NSInputMonitoringUsageDescription: LAWOSS uses keyboard monitoring to detect your dictation shortcut and support hold-to-talk outside the app.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-apple-darwin
        - opencode-x86_64-apple-darwin
        - legalwork-orchestrator
        - legalwork-orchestrator-aarch64-apple-darwin
        - legalwork-orchestrator-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "LegalWork Computer Use.app/**"
        - LegalWorkAudioTap
        - LegalWorkKeyMonitor
  target:
    - dmg
    - zip
linux:
  # The scoped package name otherwise becomes @legalworkdesktop, which
  # AppImage rejects as an executable filename.
  executableName: legalwork
  icon: resources/icons/icon.png
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-unknown-linux-gnu
        - opencode-x86_64-unknown-linux-gnu
        - legalwork-orchestrator
        - legalwork-orchestrator-aarch64-unknown-linux-gnu
        - legalwork-orchestrator-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - tar.gz
win:
  icon: resources/icons/icon.ico
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - opencode-aarch64-pc-windows-msvc.exe
        - opencode-x86_64-pc-windows-msvc.exe
        - legalwork-orchestrator.exe
        - legalwork-orchestrator-aarch64-pc-windows-msvc.exe
        - legalwork-orchestrator-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc.exe
        - versions.json-x86_64-pc-windows-msvc.exe
  target:
    - nsis
# Uninstall cleanup for the Office add-in (registry sideload entries and the
# trusted local CA) — see build/installer.nsh.
nsis:
  include: build/installer.nsh
artifactName: lawoss-${os}-${arch}-${version}.${ext}
