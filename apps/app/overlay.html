<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LegalWork Overlay</title>
    <script>
      (function () {
        try {
          var validMode = function (value) { return value === "light" || value === "dark" || value === "blackout" || value === "system"; };
          var stored = localStorage.getItem("legalwork.react.settings.theme-mode");
          var legacy = localStorage.getItem("legalwork.themePref");
          // 🟡 LAWOSS: predvolená téma dark ako v src/app/theme.ts (bez bliknutia svetlej).
          var mode = validMode(stored) ? stored : validMode(legacy) ? legacy : "dark";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "dark" || mode === "blackout" || (mode === "system" && prefersDark) ? "dark" : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.appearance = mode === "blackout" ? "blackout" : resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.appearance = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body class="overflow-hidden bg-transparent text-dls-text">
    <div id="root"></div>
    <script type="module" src="/src/overlay/index.tsx"></script>
  </body>
</html>
